<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>J Empire — The Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
[data-theme="light"]{
 --bg:#EFE9E1;--card:#FFFCF7;--card2:#EDE5D9;--card3:#E3D8C9;
 --rail:#3E2C22;--railtx:#D9C8B8;--railon:#5C4234;
 --ink:#231A14;--ink2:#4E3C31;--muted:#8A7461;--faint:#B3A08C;
 --line:#DDD1C1;--line2:#EBE2D5;
 --gold:#A67C3D;--gold-2:#7E5A26;--gold-soft:#F2E6D2;--gold-line:#CDB185;--ongold:#FFFCF7;
 --appt:#B4453F;--school:#3F5F87;--sports:#4C7A50;--personal:#8E5379;--work:#5B4B8A;--gigs:#B0703A;
 --in:#3E7A55;--out:#B4453F;
 --grain:.03;--sigop:.10;
}
[data-theme="deep"]{
 --bg:#2A1E17;--card:#F7F1E8;--card2:#E8DDCE;--card3:#DBCDB9;
 --rail:#1B120D;--railtx:#C8B29C;--railon:#3E2C22;
 --ink:#231A14;--ink2:#4E3C31;--muted:#8A7461;--faint:#B3A08C;
 --line:#D6C8B5;--line2:#E5DACA;
 --gold:#9A712F;--gold-2:#6F4E1C;--gold-soft:#EFE1C9;--gold-line:#C2A377;--ongold:#F7F1E8;
 --appt:#A83A34;--school:#365476;--sports:#3F6B44;--personal:#7C4468;--work:#4C3E78;--gigs:#9C5F2C;
 --in:#33684A;--out:#A83A34;
 --grain:.045;--sigop:.13;
}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grain);
 background-image:radial-gradient(circle at 1px 1px,var(--ink) 1px,transparent 0);background-size:4px 4px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ib{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:8px 14px;font-family:inherit;
 font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--ink2);cursor:pointer}
.sec{display:flex;align-items:baseline;gap:11px;margin:30px 0 7px}
.sec h2{margin:0;font-family:'Fraunces',serif;font-weight:700;font-size:19px;letter-spacing:-.01em}
.tag{font-size:8.5px;font-weight:800;letter-spacing:.16em;border:1px solid var(--gold-line);color:var(--gold-2);
 border-radius:2px;padding:3px 8px}
.why{font-size:12.5px;font-weight:500;color:var(--ink2);margin:0 0 12px;line-height:1.55;max-width:76ch}
.dev{font-size:8.5px;font-weight:800;letter-spacing:.16em;color:var(--faint);margin:0 0 6px}
.row2{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}

/* device */
.app{display:flex;height:100dvh;overflow:hidden;background:var(--card)}


/* chocolate rail */
#rail{width:76px;background:var(--rail);display:flex;flex-direction:column;align-items:center;flex:0 0 auto;gap:2px;
 padding:calc(14px + env(safe-area-inset-top)) 0 calc(12px + env(safe-area-inset-bottom));overflow-y:auto;
 box-shadow:inset -2px 0 0 var(--gold)}
#rail::-webkit-scrollbar{display:none}
#rail .modeSw{display:flex;flex-direction:column;gap:3px;width:62px;margin-bottom:5px}
#rail .modeSw a{border:1px solid rgba(255,255,255,.14);padding:8px 4px;position:relative}
#rail a.mon{color:var(--ongold);background:linear-gradient(100deg,var(--gold-2),var(--gold) 36%,#F0DCA8 52%,var(--gold) 66%,var(--gold-2));background-size:240% 100%;animation:shimmer 9s linear infinite}
#rail .navsep{width:42px;height:1px;background:rgba(255,255,255,.16);margin:6px 0}
#rail .bdg{position:absolute;top:2px;right:3px;background:var(--out);color:#fff;border-radius:100px;font-size:8px;font-weight:800;padding:1px 4px;font-style:normal}
#rail .crestsub{font-family:'Fraunces',serif;font-weight:700;font-size:7.5px;letter-spacing:.3em;color:var(--railtx);margin-top:2px}
#rail .crestwrap{text-align:center;margin-bottom:10px}
#rail .crest{font-family:'Pinyon Script',cursive;font-size:30px;color:var(--gold);line-height:1;margin-bottom:14px}
#rail a{width:60px;padding:11px 4px;text-align:center;font-size:8.5px;font-weight:800;letter-spacing:.14em;
 color:var(--railtx);border-radius:3px;cursor:pointer}
#rail a.on{background:var(--railon);color:#F7EEDF;box-shadow:inset 2px 0 0 var(--gold)}
#rail .sp{flex:1}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);position:relative}

.main > *{position:relative;z-index:1}
.mh{display:flex;align-items:flex-end;gap:14px;padding:12px 16px 9px;flex:0 0 auto}
.titleblk{display:flex;align-items:baseline;gap:9px;min-width:0}
.tailblk{margin-left:auto;text-align:right;min-width:0}
.quote{font-family:'Fraunces',serif;font-size:11.5px;font-style:italic;color:var(--ink2);margin-top:3px;
 transition:opacity .6s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh h1{margin:0;font-family:'Fraunces',serif;font-weight:900;font-size:30px;letter-spacing:-.03em;line-height:1}
.mh .sub{font-size:9px;font-weight:800;letter-spacing:.18em;color:var(--muted)}
.mh .tail{display:block;font-size:8.5px;font-weight:800;letter-spacing:.16em;color:var(--gold-2)}

.body2{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 238px;gap:12px;min-height:0}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 14px 14px}
#assist{margin:0 14px 8px;flex:0 0 auto}
.pane{background:var(--card);border:1px solid var(--line);border-radius:5px;overflow:hidden;display:flex;flex-direction:column;min-height:0;
 box-shadow:0 2px 10px rgba(40,28,20,.06)}
.pane.tint{background:var(--card2)}
.ph{display:flex;align-items:baseline;gap:9px;padding:10px 13px 8px;border-bottom:1px solid var(--line);flex:0 0 auto}
.ph .t{font-family:'Fraunces',serif;font-weight:700;font-size:13px;letter-spacing:.02em}
.ph .n{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.13em;color:var(--muted)}

.dows{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);background:var(--card2)}
.dows div{font-size:8px;font-weight:800;letter-spacing:.16em;color:var(--muted);padding:6px 0 5px 7px}
.wkrow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line2);min-height:0}
.wkrow.now{background:var(--card2)}
.mc{border-right:1px solid var(--line2);padding:5px 6px;min-height:0;overflow:hidden;display:flex;flex-direction:column;position:relative}
.mc:nth-child(7n){border-right:0}
.mc.dim{opacity:.28}
.mc .d{font-family:'Fraunces',serif;font-weight:600;font-size:14px;line-height:1;color:var(--ink2)}
.mc.today .d{color:var(--ongold);background:var(--rail);width:22px;height:22px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.chip{margin-top:3px;font-size:9px;font-weight:700;padding:2px 5px 2px 7px;position:relative;border-radius:2px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--c)}
.more{font-size:8px;font-weight:800;color:var(--faint);margin-top:2px}
.fold{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 10px 10px 0;
 border-color:transparent var(--gold-line) transparent transparent}

.sh{font-family:'Fraunces',serif;font-weight:700;font-size:10px;letter-spacing:.2em;color:var(--gold-2);
 padding:10px 13px 6px;border-bottom:1px solid var(--gold-line);margin:0 13px;flex:0 0 auto}
.sp{padding:0 13px;min-height:0;overflow:hidden}
.sp.grow{flex:1}
.srow{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:11px;font-weight:600;border-bottom:1px solid var(--line2)}
.srow .dt{font-family:'Fraunces',serif;font-weight:700;font-size:11.5px;color:var(--gold-2);flex:0 0 20px}
.srow .v{margin-left:auto;font-family:'Fraunces',serif;font-weight:800;font-variant-numeric:tabular-nums}
.srow .v.in{color:var(--in)}.srow .v.out{color:var(--out)}
.srow.tot{border-bottom:0;border-top:1px solid var(--ink);margin-top:5px;padding-top:8px;font-size:12.5px;font-weight:800}
.sq{width:11px;height:11px;border:1px solid var(--gold-line);border-radius:2px;flex:0 0 auto;background:var(--card)}

/* week cards */
.cards{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:9px;padding:12px;min-height:0}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:9px 10px;display:flex;flex-direction:column;
 min-height:0;overflow:hidden;box-shadow:0 2px 8px rgba(40,28,20,.06)}
.dcard:nth-child(even){background:var(--card2)}
.dcard.today{background:var(--card3);border-color:var(--gold-line)}
.dch{display:flex;align-items:baseline;gap:7px;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--gold-line);flex:0 0 auto}
.dch .wd{font-family:'Fraunces',serif;font-weight:700;font-size:14px}
.dch .dt{font-family:'Fraunces',serif;font-size:13px;color:var(--gold-2);font-weight:700}
.dch .ct{margin-left:auto;font-size:8px;font-weight:800;color:var(--faint)}
.ad{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--gold-2);margin-bottom:5px}
.ev{margin-bottom:4px;padding:3px 6px 3px 9px;position:relative;font-size:11px;font-weight:700;line-height:1.3;
 border-radius:2px;color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent)}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--c)}
.ev .tm{font-family:'Fraunces',serif;font-weight:700;font-size:10px;opacity:.75;margin-right:4px}
.mini{font-size:7.5px;font-weight:800;letter-spacing:.16em;color:var(--faint);margin:6px 0 3px}
.tdo{display:flex;align-items:flex-start;gap:7px;font-size:10.5px;font-weight:600;padding:3px 0;color:var(--ink2)}

/* to do */
.tdgrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:12px;min-height:0}
.tdc{background:var(--card);border:1px solid var(--line);border-radius:5px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tdc:nth-child(even){background:var(--card2)}
.tdh{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--gold-line);margin:0 12px;flex:0 0 auto}
.tdh .lb{font-family:'Fraunces',serif;font-weight:700;font-size:12px;letter-spacing:.09em;color:var(--c)}
.tdh .ct{margin-left:auto;font-family:'Fraunces',serif;font-weight:900;font-size:16px;color:var(--c)}
.tdb{flex:1;min-height:0;overflow:hidden;padding:6px 12px}
.tdr{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:11px;font-weight:600}
.tdr:last-child{border-bottom:0}
.tdr .dt{font-family:'Fraunces',serif;font-size:9.5px;font-weight:700;color:var(--gold-2);margin-left:auto;flex:0 0 auto}
.tdr .dt.late{color:var(--out)}

/* notebook */
.nb{flex:1;display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;padding:12px;min-height:0}
.nbf div{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:11px;font-weight:700;border-radius:2px;margin:0 6px}
.nbf div.on{background:var(--card3)}
.nbf div s{width:8px;height:8px;border-radius:2px;background:var(--c);text-decoration:none;display:inline-block}
.nbf div .ct{margin-left:auto;font-size:9.5px;font-weight:800;color:var(--faint)}
.nbe{display:flex;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line2)}
.nbd{flex:0 0 42px;text-align:center}
.nbd .dd{font-family:'Fraunces',serif;font-weight:900;font-size:21px;line-height:1}
.nbd .mm{font-family:'Fraunces',serif;font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--gold-2);margin-top:2px}
.nbt{font-size:11.5px;font-weight:500;line-height:1.6;color:var(--ink2)}
.nbt .ln{display:inline-block;width:15px;font-family:'Fraunces',serif;font-size:9.5px;font-weight:700;color:var(--faint)}
.tags{display:flex;gap:5px;margin-bottom:4px}
.tg{font-size:7.5px;font-weight:800;letter-spacing:.1em;padding:2px 6px;border-radius:2px;color:var(--c);
 background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.shots{display:flex;gap:6px;margin-top:7px}
.sh2{width:60px;height:60px;border-radius:3px;border:1px solid var(--gold-line);background:var(--card2);
 display:flex;align-items:center;justify-content:center;font-size:17px;position:relative}
.sh2 .cap{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--ink) 74%,transparent);
 color:var(--card);font-size:6.5px;font-weight:800;letter-spacing:.05em;padding:2px;text-align:center}
.sh2.add{border-style:dashed;color:var(--faint)}

/* phone */
.prail{display:flex;gap:0;background:var(--rail);flex:0 0 auto;overflow-x:auto}
.prail div{flex:1;min-width:52px;text-align:center;padding:9px 4px;font-size:8px;font-weight:800;letter-spacing:.12em;color:var(--railtx)}
.prail div.on{background:var(--railon);color:#F7EEDF;box-shadow:inset 0 -2px 0 var(--gold)}
.pbody{flex:1;min-height:0;overflow:hidden;background:var(--bg);position:relative}
.pbody::after{content:"J";position:absolute;right:-4%;bottom:-8%;font-family:'Pinyon Script',cursive;font-size:200px;
 line-height:.75;color:var(--gold);opacity:var(--sigop);pointer-events:none}
.pbody > *{position:relative;z-index:1}
.pgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;height:176px;background:var(--card);border-bottom:1px solid var(--line)}
.pc{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:3px}
.pc:nth-child(7n){border-right:0}
.pc.dim{opacity:.28}
.pc .n{font-family:'Fraunces',serif;font-size:12px;font-weight:600}
.pc.today .n{background:var(--rail);color:var(--ongold);width:20px;height:20px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:11px}
.pc .dots{display:flex;gap:2px;min-height:4px}
.pc .dots i{width:3.5px;height:3.5px;border-radius:50%;background:var(--c)}
.prow{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);background:var(--card)}
.prow:nth-child(even){background:var(--card2)}
.prow.today{background:var(--card3)}
.prow .pd{flex:0 0 32px}
.prow .pd .wd{font-family:'Fraunces',serif;font-size:12px;font-weight:700;line-height:1}
.prow .pd .dt{font-family:'Fraunces',serif;font-size:11px;color:var(--gold-2);font-weight:700}
.note{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:15px 17px;margin-top:14px;
 font-size:12.5px;color:var(--ink2);font-weight:500;line-height:1.6}
.note b{color:var(--ink);font-weight:800}

0%{background-position:-180% 0}
100%{background-position:280% 0}


/* ---------- SHELL ---------- */
.app{display:flex;height:100dvh;overflow:hidden}


/* ---------- PANES ---------- */
.pane{background:var(--card);border:1px solid var(--line);border-radius:5px;overflow:hidden;position:relative;
 display:flex;flex-direction:column;min-height:0;box-shadow:0 2px 10px rgba(40,28,20,.07)}

.sidepane{overflow-y:auto}


/* ---------- MONTH ---------- */
.dows{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--gold-line);background:var(--card2);flex:0 0 auto}


/* ---------- WEEK CARDS ---------- */
.cards{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:9px;min-height:0}


/* ---------- DAY ---------- */
.adband{display:flex;flex-wrap:wrap;gap:6px;padding:9px 11px;border-bottom:1px solid var(--line);flex:0 0 auto}

.dayscroll{flex:1;min-height:0;overflow-y:auto}

.dayrail{position:relative;padding-left:52px}

.hrow{height:44px;border-bottom:1px solid var(--line2);position:relative}

.hlab{position:absolute;left:-48px;top:2px;font-family:'Fraunces',serif;font-size:10.5px;font-weight:700;color:var(--muted)}

.dslot{position:absolute;left:4px;right:8px;height:42px;border-radius:2px;padding:4px 8px;overflow:hidden;
 background:color-mix(in srgb,var(--c) 12%,transparent);border-left:3px solid var(--c);cursor:pointer}

.dslot .tm{display:block;font-family:'Fraunces',serif;font-size:9px;font-weight:700;color:var(--c)}

.dslot .nm{font-size:12px;font-weight:700;line-height:1.2}

.nowline{position:absolute;left:52px;right:0;border-top:2px solid var(--gold);z-index:4}

.nowline::before{content:"";position:absolute;left:2px;top:-5px;width:9px;height:9px;border-radius:50%;background:var(--gold)}

.notecard2{font-size:11.5px;font-weight:500;line-height:1.7;cursor:pointer;padding:4px 0}

.ln{display:inline-block;width:15px;font-family:'Fraunces',serif;font-size:9.5px;font-weight:700;color:var(--faint)}


/* ---------- TO DO ---------- */
.tdsum{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;flex:0 0 auto;margin-bottom:10px}

.tdsum div{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:9px 6px;text-align:center}

.tdsum b{display:block;font-family:'Fraunces',serif;font-weight:900;font-size:20px;line-height:1;color:var(--c)}

.tdsum span{display:block;font-size:7.5px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin-top:4px}

.tdgrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;min-height:0}

.tdc{background:var(--card);border:1px solid var(--line);border-radius:5px;display:flex;flex-direction:column;
 min-height:0;overflow:hidden;position:relative}

.tdc:nth-child(even){background:var(--card2)}

.tdh{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--gold-line);margin:0 12px;flex:0 0 auto}

.tdh .lb{font-family:'Fraunces',serif;font-weight:700;font-size:12px;letter-spacing:.09em;color:var(--c)}

.tdh .ct{margin-left:auto;font-family:'Fraunces',serif;font-weight:900;font-size:17px;color:var(--c)}

.tdb{flex:1;min-height:0;overflow-y:auto;padding:5px 12px}

.tdr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:11.5px;font-weight:600}

.tdr:last-child{border-bottom:0}

.tdr .tx{flex:1;cursor:pointer}

.tdr.done .tx{text-decoration:line-through;color:var(--faint)}

.tdt{font-family:'Fraunces',serif;font-size:9.5px;font-weight:700;color:var(--gold-2);flex:0 0 auto}

.tdt.late{color:var(--out-s)}

.tdr .x{color:var(--faint);font-size:14px;cursor:pointer;padding:0 2px}

.tdadd{margin:6px 12px 10px;border:1px dashed var(--gold-line);background:transparent;border-radius:3px;padding:8px;
 font-family:inherit;font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--muted);cursor:pointer;flex:0 0 auto}


/* ---------- NOTEBOOK ---------- */
.nbsearch{margin:11px 13px 4px;border:1px solid var(--line);border-radius:3px;padding:8px 10px;background:var(--card)}

.nbsearch input{width:100%;border:0;background:transparent;font-family:inherit;font-size:12px;color:var(--ink);outline:none}

.nbpane{overflow-y:auto}

.nbe{display:flex;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line2);cursor:pointer}

.nbd{flex:0 0 42px;text-align:center}

.nbd .dd{font-family:'Fraunces',serif;font-weight:900;font-size:21px;line-height:1}

.nbd .mm{font-family:'Fraunces',serif;font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--gold-2);margin-top:2px}

.nbt{font-size:11.5px;font-weight:500;line-height:1.65;color:var(--ink2)}

.tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap}

<script>
const $=id=>document.getElementById(id);
const on=(id,ev,fn)=>{const e=$(id);if(e)e[ev]=fn};
const setEl=(id,prop,val)=>{const e=$(id);if(e)e[prop]=val};
/* ================= SUPABASE ================= */
const SB_URL='https://ejseathlglvvnmkpchib.supabase.co/rest/v1/';
const SB_KEY='sb_publishable_vcdD-PwNinJgjarQsRhGBA_eNvFCAMu';
const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
function toast(m){const s=document.getElementById('toast');if(!s)return;s.textContent=m;s.classList.add('show');
 clearTimeout(s._t);s._t=setTimeout(()=>s.classList.remove('show'),1800)}
async function api(path,opt={}){
 try{const r=await fetch(SB_URL+path,{headers:H,...opt});
  if(!r.ok){const t=await r.text();console.error(path,t);toast('Save failed');return null}
  const t=await r.text();return t?JSON.parse(t):[];
 }catch(e){console.error(e);toast('Cannot reach your data — nothing saved');return null}
}
const dbAll=t=>api(t+'?select=*');
const dbAdd=(t,row)=>api(t,{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(row)});
const dbSet=(t,id,patch)=>api(t+'?id=eq.'+id,{method:'PATCH',body:JSON.stringify(patch)});

const dbNote=(d,b)=>api('jp_notes',{method:'POST',headers:{...H,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({date:d,body:b,updated_at:new Date().toISOString()})});

/* ================= CONFIG ================= */
const CATS={Appointments:'appt',School:'school',Sports:'sports',Personal:'personal','Work & Serving':'work',Gigs:'gigs'};
const CATLIST=Object.keys(CATS);
const WHO=['Jasz','Lani','Jules','Liyah','Zelli','Jeo'];
const SOURCES=['State paycheck','CS (Cartagena)','CS (Aguayo)','DoorDash / Uber','Process serving','Other'];
const ACCOUNTS=['Navy Federal','TD Bank','PNC','Capital One','Cash App','smiONE','Other'];
const GIG=['DoorDash / Uber','Process serving'];
const QUOTES=["Built by a strong mama.","Nobody is coming. Get it done.","Six kids. One empire. No excuses.",
 "The plan only works if you work it.","You have done harder than today.","Discipline over motivation, always.",
 "Small moves, every single day.","Handle it before it handles you.","Tired is not the same as done.",
 "You are the plan B you were waiting on."];
const SEASON_END='2026-10-31';
const TEMPLATES=[
 {l:'Football practice',cat:'Sports',time:'18:00',leave:'17:30',rep:'weekly',end:SEASON_END,who:'Jules'},
 {l:'Football game',cat:'Sports',time:'09:00',leave:'08:00',rep:'weekly',end:SEASON_END,who:'Jules'},
 {l:'Away game',cat:'Sports',time:'09:00',leave:'07:30',who:'Jules'},
 {l:'No school',cat:'School',allDay:true},
 {l:'Early release',cat:'School',time:'13:00'},
 {l:'Teacher conference',cat:'School',time:'15:00'},
 {l:'Picture day',cat:'School',allDay:true},
 {l:'Field trip',cat:'School',allDay:true},
 {l:'Kid appointment',cat:'Appointments',time:'10:00'},
 {l:'Medication refill',cat:'Appointments',allDay:true},
 {l:'Plasma donation',cat:'Personal',who:'Jasz'},
 {l:'Haircut',cat:'Personal',time:'16:00'},
 {l:'Gym',cat:'Personal',time:'04:50',rep:'weekly',who:'Jasz'},
 {l:'Bike',cat:'Personal',time:'05:30',rep:'weekly',who:'Jasz'},
 {l:'Meal prep',cat:'Personal',time:'14:00',rep:'weekly',who:'Jasz'},
 {l:'Study block',cat:'Personal',time:'20:00',who:'Jasz'},
 {l:'Serve attempt',cat:'Work & Serving',time:'19:00',who:'Jasz'},
 {l:'Court deadline',cat:'Work & Serving',allDay:true,who:'Jasz'},
 {l:'DoorDash shift',cat:'Gigs',time:'17:00',who:'Jasz'}
];
const FB_DAYS=[1,2,4],FB_S=18,FB_E=20,GYM_DAYS=[2,3,4,5],HEAVY=4;

const S={events:[],todos:[],flows:[],bills:[],accounts:[],appts:[],income:[],alloc:[],settings:{},notes:{},
 mode:'life',view:'month',mtab:'m',splitIdx:null,cursor:new Date(),sel:new Date(),tab:'To-Do',kid:'',showAll:false,apptAll:false};
const TODAY=new Date();TODAY.setHours(0,0,0,0);

const key=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const parse=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c)};
const same=(a,b)=>key(a)===key(b);
const money=n=>'$'+Math.round(+n||0).toLocaleString();
const money2=n=>'$'+(+n||0).toLocaleString(undefined,{minimumFractionDigits:(+n)%1?2:0,maximumFractionDigits:2});
const fmt=t=>{if(!t)return'';let[h,m]=String(t).split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return h+(m?':'+String(m).padStart(2,'0'):'')+' '+ap};
const dd=d=>Math.round((parse(key(d))-parse(key(TODAY)))/864e5);
const sid=()=>'s'+Date.now()+Math.floor(Math.random()*999);

function nthDow(y,m,dw,n){const d=new Date(y,m,1);let c=0;for(;;){if(d.getDay()===dw&&++c===n)return new Date(d);d.setDate(d.getDate()+1)}}
function lastDow(y,m,dw){const d=new Date(y,m+1,0);while(d.getDay()!==dw)d.setDate(d.getDate()-1);return d}
function obs(y,m,x){const d=new Date(y,m,x);if(d.getDay()===0)d.setDate(d.getDate()+1);if(d.getDay()===6)d.setDate(d.getDate()-1);return d}
const holY=y=>[[obs(y,0,1),"New Year's Day"],[nthDow(y,0,1,3),"MLK Day"],[nthDow(y,1,1,3),"Presidents' Day"],
 [lastDow(y,4,1),"Memorial Day"],[obs(y,5,19),"Juneteenth"],[obs(y,6,4),"Independence Day"],
 [nthDow(y,8,1,1),"Labor Day"],[nthDow(y,9,1,2),"Columbus Day"],[obs(y,10,11),"Veterans Day"],
 [nthDow(y,10,4,4),"Thanksgiving"],[obs(y,11,25),"Christmas"]].reduce((m,[d,n])=>(m[key(d)]=n,m),{});
let HOL={};[TODAY.getFullYear()-1,TODAY.getFullYear(),TODAY.getFullYear()+1].forEach(y=>Object.assign(HOL,holY(y)));

function payset(){
 const P=new Set(),anchor=parse(S.settings.pay_anchor||'2026-08-21');
 let b=new Date(anchor);while(b>new Date(TODAY.getFullYear()-1,0,1)){P.add(key(b));b.setDate(b.getDate()-14)}
 let f=new Date(anchor);while(f<new Date(TODAY.getFullYear()+2,0,1)){P.add(key(f));f.setDate(f.getDate()+14)}
 return P;
}
let PAY=new Set();
const nextPay=from=>{const d=new Date(from);for(let i=0;i<40;i++){if(PAY.has(key(d))&&d>=from)return new Date(d);d.setDate(d.getDate()+1)}};

/* ================= GARDEN ================= */
function garden(){}


/* ================= DERIVED ================= */
const kidOK=e=>!S.kid||e.who===S.kid;
function evOn(d){
 const k=key(d);
 return S.events.filter(e=>kidOK(e)&&(e.date===k||(e.end_date&&e.date<=k&&k<=e.end_date)))
  .sort((a,b)=>((a.all_day?'0':a.time||'zz')).localeCompare(b.all_day?'0':b.time||'zz'));
}
const flowsOn=d=>S.flows.filter(f=>f.date===key(d));
const openOut=()=>S.flows.filter(f=>f.kind==='out'&&!f.done);
const srcOf=f=>S.income.find(x=>x.name===f.source);
const isGig=f=>{const s2=srcOf(f);return s2?s2.freq==='none':GIG.includes(f.source)};
const isTaxable=f=>{const s2=srcOf(f);return !!(s2&&s2.taxable)};
/* projected income excludes unreceived gig money */
const countsIn=f=>f.kind==='in'&&(f.done||!isGig(f));

function monthTotals(){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 const inM=f=>{const d=parse(f.date);return d.getFullYear()===y&&d.getMonth()===m};
 const fl=S.flows.filter(inM);
 const i=fl.filter(countsIn).reduce((s,x)=>s+(+x.amount||0),0);
 const o=fl.filter(x=>x.kind==='out'&&!isGas(x)).reduce((s,x)=>s+(+x.amount||0),0);
 const gas=fl.filter(isGas).reduce((s,x)=>s+(+x.amount||0),0);
 const carry=overdueTotal();
 /* only spending still to come counts against the projection */
 const daysLeft=Math.max(0,new Date(y,m+1,0).getDate()-(same(new Date(y,m,1),new Date(TODAY.getFullYear(),TODAY.getMonth(),1))?TODAY.getDate():0));
 const spend=(+S.settings.weekly_spend||0)*(daysLeft/7);
 /* forward-looking: from today's real balance, minus what is still unpaid */
 const stillOut=fl.filter(x=>x.kind==='out'&&!x.done&&parse(x.date)>=TODAY).reduce((s,x)=>s+(+x.amount||0),0);
 const stillIn=fl.filter(x=>countsIn(x)&&!x.done&&parse(x.date)>=TODAY).reduce((s,x)=>s+(+x.amount||0),0);
 const end=balanceNow()-carry-stillOut+stillIn-spend;
 return{i,o,gas,spend,carry,end,start:balanceNow()};
}
function beforeNextPay(){
 const p=nextPay(TODAY);if(!p)return{amt:0,when:'—',list:[]};
 const list=openOut().filter(f=>parse(f.date)>=TODAY&&parse(f.date)<=p);
 return{amt:list.reduce((s,x)=>s+(+x.amount||0),0),when:p.toLocaleDateString(undefined,{month:'short',day:'numeric'}),list};
}
function balanceNow(){return S.accounts.filter(a=>!a.separate).reduce((s,a)=>s+(+a.balance||0),0)}
function overdueTotal(){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 return S.flows.filter(f=>f.kind==='out'&&!f.done&&parse(f.date)<new Date(y,m,1))
  .reduce((s,f)=>s+(+f.amount||0),0);
}
/* Balance is what you typed = today. Past days show nothing projected;
   future days build forward from today, counting only what is still unpaid. */
function runBal(y,m){
 const map={},days=new Date(y,m+1,0).getDate();
 let b=balanceNow()-overdueTotal();
 for(let d=1;d<=days;d++){
  const dt=new Date(y,m,d),k=key(dt);
  if(parse(k)<parse(key(TODAY))){map[k]=null;continue}
  if(same(dt,TODAY)){map[k]=b;continue}
  S.flows.filter(f=>f.date===k).forEach(f=>{
   if(f.kind==='out'&&!f.done)b-=+f.amount||0;
   else if(countsIn(f)&&!f.done)b+=+f.amount||0});
  map[k]=b;
 }
 return map;
}
const billOn=b=>{const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 return S.flows.find(f=>f.bill_id===b.id&&parse(f.date).getFullYear()===y&&parse(f.date).getMonth()===m)};
function accShort(){
 const out=[];
 S.accounts.filter(a=>!a.separate).forEach(a=>{
  const due=openOut().filter(f=>f.account===a.name&&parse(f.date)>=TODAY&&parse(f.date)<=(nextPay(TODAY)||TODAY))
   .reduce((s,f)=>s+(+f.amount||0),0);
  if(due>(+a.balance||0))out.push({name:a.name,due,have:+a.balance||0});
 });
 return out;
}

/* ================= ASSISTANT ================= */
function alertsMoney(){
 const A=[];
 const od=openOut().filter(f=>dd(parse(f.date))<0);
 if(od.length)A.push({sc:'var(--hi-s)',t:od.length===1?od[0].title+' is '+Math.abs(dd(parse(od[0].date)))+' days late':od.length+' bills overdue',v:money(od.reduce((s,x)=>s+(+x.amount||0),0)),
  items:od.map(f=>({kind:'flow',id:f.id,n:f.title,s:money2(f.amount)+' \u00b7 was due '+parse(f.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}))});
 const miss=S.bills.filter(b=>b.active&&!billOn(b));
 if(miss.length)A.push({sc:'var(--gold-2)',t:miss.length+' bill'+(miss.length>1?'s':'')+" not on this month",v:money(miss.reduce((s,b)=>s+(+b.amount||0),0)),
  items:miss.map(b=>({kind:'bill',id:b.id,n:b.name,s:(b.amount?money2(b.amount):'no amount set')+' \u00b7 due the '+b.due_day}))});
 const{end}=monthTotals(),cush=+S.settings.cushion||0;
 if(S.flows.length&&end<cush)A.push({sc:'var(--hi-s)',t:end<0?'This month ends below zero':'Ends under your '+money(cush)+' cushion',v:money(end)});
 const rb=runBal(S.cursor.getFullYear(),S.cursor.getMonth());
 const dip=Object.entries(rb).find(([k,v])=>v<0&&parse(k)>=TODAY);
 if(dip)A.push({sc:'var(--hi-s)',t:'Goes negative '+parse(dip[0]).toLocaleDateString(undefined,{month:'short',day:'numeric'}),v:money(dip[1]),
  items:S.flows.filter(f=>f.kind==='out'&&!f.done&&f.date<=dip[0]&&parse(f.date)>=TODAY).map(f=>({kind:'flow',id:f.id,n:f.title,s:money2(f.amount)+' \u00b7 '+parse(f.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}))});
 accShort().forEach(a=>A.push({sc:'var(--hi-s)',t:a.name+' is short before payday',v:money(a.due-a.have),
  items:openOut().filter(f=>f.account===a.name).map(f=>({kind:'flow',id:f.id,n:f.title,s:money2(f.amount)+' \u00b7 '+parse(f.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}))}));
 if((+S.settings.gas_budget||0)>0&&(+S.settings.weekly_spend||0)>0)
  A.push({sc:'var(--gold-2)',t:'Gas is counted twice \u2014 zero out weekly spending',v:'\u2192 Out tab'});
 const carry=overdueTotal();
 if(carry>0)A.push({sc:'var(--hi-s)',t:'Carried in from earlier months',v:money(carry),
  items:S.flows.filter(f=>f.kind==='out'&&!f.done&&parse(f.date)<new Date(S.cursor.getFullYear(),S.cursor.getMonth(),1))
   .map(f=>({kind:'flow',id:f.id,n:f.title,s:money2(f.amount)+' \u00b7 was due '+parse(f.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}))});
 const noAmt=S.flows.filter(f=>!+f.amount);
 if(noAmt.length)A.push({sc:'var(--gold-2)',t:noAmt.length+' entr'+(noAmt.length>1?'ies have':'y has')+' no amount',v:'\u2014',
  items:noAmt.map(f=>({kind:'flow',id:f.id,n:f.title,s:parse(f.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}))});
 return A;
}
function alertsLife(){
 const A=[];
 const up=S.events.filter(e=>parse(e.date)>=TODAY);
 const byD={};up.filter(e=>e.time).forEach(e=>(byD[e.date]=byD[e.date]||[]).push(e));
 const clash=[];
 Object.entries(byD).forEach(([d,l])=>{l.sort((a,b)=>a.time.localeCompare(b.time));
  for(let i=1;i<l.length;i++)if(l[i].time===l[i-1].time)clash.push(l[i],l[i-1])});
 if(clash.length)A.push({sc:'var(--hi-s)',t:'Double-booked',v:[...new Set(clash.map(e=>parse(e.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})))].join(', '),
  items:[...new Set(clash)].map(e=>({kind:'event',id:e.id,n:e.title,s:parse(e.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' \u00b7 '+fmt(e.time)}))});
 const seen=new Set(),heavy=[];
 up.forEach(e=>{if(seen.has(e.date))return;const n=S.events.filter(x=>x.date===e.date).length;
  if(n>=HEAVY){seen.add(e.date);heavy.push({d:e.date,n})}});
 heavy.forEach(h=>A.push({sc:'var(--gold-2)',t:parse(h.d).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+' is loaded',v:h.n+' things',
  items:S.events.filter(x=>x.date===h.d).map(e=>({kind:'event',id:e.id,n:e.title,s:(e.time?fmt(e.time):'no time')+(e.who?' \u00b7 '+e.who:'')}))}));
 const nt=up.filter(e=>!e.time&&!e.all_day);
 if(nt.length)A.push({sc:'var(--gold-2)',t:nt.length+' upcoming event'+(nt.length>1?'s have':' has')+' no time',v:'',
  items:nt.map(e=>({kind:'event',id:e.id,n:e.title,s:parse(e.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' \u00b7 '+e.cat}))});
 const book=S.appts.filter(a=>a.active&&!a.date);
 if(book.length)A.push({sc:'var(--hi-s)',t:book.length+' appointment'+(book.length>1?'s':'')+' need booking',v:'',
  items:book.map(a=>({kind:'appt',id:a.id,n:a.who+' \u2014 '+a.what,s:a.every_months?'every '+a.every_months+' months':'not booked'}))});
 return A;
}

function calCells(build){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 let h='';for(let i=0;i<first;i++)h+='<div class="c dim"></div>';
 for(let d=1;d<=days;d++)h+=build(new Date(y,m,d),d);
 const rows=Math.ceil((first+days)/7);
 for(let i=first+days;i<rows*7;i++)h+='<div class="c dim"></div>';

function lifeMonth(){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 const rows=Math.ceil((first+days)/7);
 const nowRow=(TODAY.getMonth()===m&&TODAY.getFullYear()===y)?Math.floor((first+TODAY.getDate()-1)/7):-1;
 let grid='';
 for(let w=0;w<rows;w++){
  const isNow=w===nowRow;let cs='';
  for(let i=0;i<7;i++){
   const d=w*7+i-first+1;
   if(d<1||d>days){cs+='<div class="mc dim"></div>';continue}
   const dt=new Date(y,m,d),k=key(dt),ev=evOn(dt),ho=HOL[k],pay=PAY.has(k);
   const max=isNow?2:1;
   const chips=(pay?'<div class="chip" style="--c:var(--in-s)">Payday</div>':'')
    +ev.slice(0,max).map(e=>`<div class="chip" style="--c:var(--${CATS[e.cat]}-s)">${e.title}</div>`).join('')
    +(ev.length>max?`<div class="more">+${ev.length-max}</div>`:'');
   cs+=`<div class="mc ${same(dt,TODAY)?'today':''} ${same(dt,S.sel)?'sel':''}" data-d="${k}">
     ${(S.notes[k]||'').trim()?'<span class="fold"></span>':''}
     <div class="d">${d}</div>${ho?`<div class="hol">${ho}</div>`:''}${chips}
     <div class="dots">${pay?'<i style="--c:var(--in-s)"></i>':''}${ev.slice(0,3).map(e=>`<i style="--c:var(--${CATS[e.cat]}-s)"></i>`).join('')}</div></div>`;
  }

 }
 const wkStart=new Date(TODAY);wkStart.setDate(wkStart.getDate()-wkStart.getDay());
 const wkEnd=new Date(wkStart);wkEnd.setDate(wkEnd.getDate()+7);
 const left=S.events.filter(e=>{const d=parse(e.date);return d>=TODAY&&d<wkEnd}).slice(0,4);
 const leftTd=S.todos.filter(t=>!t.done).slice(0,3);

      <span class="cdot" style="--c:var(--${CATS[e.cat]}-s)"></span>

 const slots=tm.map(e=>{const[hh,mm]=e.time.split(':').map(Number);
  return `<div class="dslot" data-ev="${e.id}" style="top:${((hh+mm/60)-6)*44+1}px;--c:var(--${CATS[e.cat]}-s)">

 return `<div class="body2">

/* month-wide: does all income cover all bills */
function monthCoverage(){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 const inM=f=>{const d=parse(f.date);return d.getFullYear()===y&&d.getMonth()===m};
 const deps=S.flows.filter(f=>f.kind==='in'&&inM(f));
 const bills=S.flows.filter(f=>f.kind==='out'&&!f.done&&!isGas(f)&&(inM(f)||parse(f.date)<new Date(y,m,1)));
 const owed=bills.reduce((s2,b)=>s2+Math.max(0,(+b.amount||0)-paidOn(b.id)),0);
 const unassigned=deps.reduce((s2,d)=>s2+Math.max(0,(+d.amount||0)-spentOf(d.id)),0);
 const days=new Date(y,m+1,0).getDate();
 const spend=Math.round((+S.settings.weekly_spend||0)*(days/7));
 return{owed,unassigned,short:owed-unassigned,spend,deps,bills};
}

function incomeDates(src,from,to){
 const out=[];if(!src.anchor||src.freq==='none')return out;
 let d=parse(src.anchor);
 while(d>from){const p=new Date(d);
  if(src.freq==='biweekly')p.setDate(p.getDate()-14);
  else if(src.freq==='monthly')p.setMonth(p.getMonth()-1);
  else if(src.freq==='weekly')p.setDate(p.getDate()-7);
  else break;
  if(p<from)break;d=p}
 while(d<from){if(src.freq==='biweekly')d.setDate(d.getDate()+14);
  else if(src.freq==='monthly')d.setMonth(d.getMonth()+1);
  else if(src.freq==='weekly')d.setDate(d.getDate()+7);else break}
 let guard=0;
 while(d<=to&&guard++<200){out.push(key(d));
  if(src.freq==='biweekly')d.setDate(d.getDate()+14);
  else if(src.freq==='monthly')d.setMonth(d.getMonth()+1);
  else if(src.freq==='weekly')d.setDate(d.getDate()+7);else break}
 return out;
}
async function syncIncome(){

 for(const src of S.income.filter(x=>x.active&&x.freq!=='none'&&+x.amount>0)){
  for(const k of incomeDates(src,from,to)){
   if(S.flows.some(f=>f.date===k&&f.source===src.name))continue;
   const r=await dbAdd('jp_flows',{kind:'in',title:src.name,amount:src.amount,date:k,
    source:src.name,account:src.account,done:parse(k)<=TODAY});
   if(r&&r[0])S.flows.push(r[0]);
  }
 }
}

/* ================= CALENDAR EXPORT ================= */
function icsEsc(t){return String(t||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n')}
function icsStamp(d){const p=n=>String(n).padStart(2,'0');
 return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+p(d.getUTCHours())+p(d.getUTCMinutes())+'00Z'}
function icsLocal(dateStr,timeStr){const p=n=>String(n).padStart(2,'0');
 const d=parse(dateStr);const[h,mi]=(timeStr||'00:00').split(':').map(Number);
 return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(h)+p(mi)+'00'}
function icsDay(dateStr,plus){const d=parse(dateStr);if(plus)d.setDate(d.getDate()+plus);
 const p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())}
function buildICS(keep){
 const okEv=new Set(keep.filter(x=>x.k==='ev').map(x=>x.id));
 const okAp=new Set(keep.filter(x=>x.k==='ap').map(x=>x.id));
 const okFl=new Set(keep.filter(x=>x.k==='fl').map(x=>x.id));
 const okTd=new Set(keep.filter(x=>x.k==='td').map(x=>x.id));
 const now=icsStamp(new Date());
 let L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//J Empire//Planner//EN','CALSCALE:GREGORIAN',
  'METHOD:PUBLISH','X-WR-CALNAME:J Empire Planner','X-WR-TIMEZONE:America/New_York'];
 S.events.filter(e=>okEv.has(e.id)).forEach(e=>{
  const who=e.who?' ('+e.who+')':'';
  L.push('BEGIN:VEVENT','UID:ev'+e.id+'@jempire','DTSTAMP:'+now,
   'SUMMARY:'+icsEsc(e.title+who));
  if(e.all_day||!e.time){
   L.push('DTSTART;VALUE=DATE:'+icsDay(e.date),'DTEND;VALUE=DATE:'+icsDay(e.end_date||e.date,1));
  }else{
   L.push('DTSTART;TZID=America/New_York:'+icsLocal(e.date,e.time));
   const[h,mi]=e.time.split(':').map(Number);
   const endH=String(Math.min(23,h+1)).padStart(2,'0');
   L.push('DTEND;TZID=America/New_York:'+icsLocal(e.date,endH+':'+String(mi).padStart(2,'0')));
  }
  if(e.location)L.push('LOCATION:'+icsEsc(e.location));
  L.push('CATEGORIES:'+icsEsc(e.cat));
  if(e.leave_by&&e.time){
   const[lh,lm]=e.leave_by.split(':').map(Number),[h,m2]=e.time.split(':').map(Number);
   const mins=Math.max(0,(h*60+m2)-(lh*60+lm));
   L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Leave now \u2014 '+e.title),
    'TRIGGER:-PT'+mins+'M','END:VALARM');
  }else if(!e.all_day&&e.time){
   L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),'TRIGGER:-PT30M','END:VALARM');
  }
  L.push('END:VEVENT');
 });
 S.appts.filter(a=>okAp.has(a.id)).forEach(a=>{
  L.push('BEGIN:VEVENT','UID:ap'+a.id+'@jempire','DTSTAMP:'+now,
   'SUMMARY:'+icsEsc((a.who?a.who+' \u2014 ':'')+a.what));
  if(a.time){L.push('DTSTART;TZID=America/New_York:'+icsLocal(a.date,a.time));
   const[h,mi]=a.time.split(':').map(Number);
   L.push('DTEND;TZID=America/New_York:'+icsLocal(a.date,String(Math.min(23,h+1)).padStart(2,'0')+':'+String(mi).padStart(2,'0')));
  }else L.push('DTSTART;VALUE=DATE:'+icsDay(a.date),'DTEND;VALUE=DATE:'+icsDay(a.date,1));
  if(a.provider)L.push('LOCATION:'+icsEsc(a.provider));
  L.push('CATEGORIES:Appointments');
  if(a.time)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(a.what),'TRIGGER:-PT60M','END:VALARM');
  L.push('END:VEVENT');
 });
 S.flows.filter(f=>okFl.has(f.id)).forEach(f=>{
  L.push('BEGIN:VEVENT','UID:fl'+f.id+'@jempire','DTSTAMP:'+now,
   'SUMMARY:'+icsEsc('\ud83d\udcb5 '+f.title+' \u2014 '+money2(f.amount)),
   'DTSTART;VALUE=DATE:'+icsDay(f.date),'DTEND;VALUE=DATE:'+icsDay(f.date,1),
   'CATEGORIES:Bills',
   'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(f.title+' due today'),'TRIGGER:-P1D','END:VALARM',
   'END:VEVENT');
 });
 S.todos.filter(t=>okTd.has(t.id)).forEach(t=>{
  L.push('BEGIN:VEVENT','UID:td'+t.id+'@jempire','DTSTAMP:'+now,
   'SUMMARY:'+icsEsc('\u2610 '+t.title+' ('+t.list+')'),
   'DTSTART;VALUE=DATE:'+icsDay(key(TODAY)),'DTEND;VALUE=DATE:'+icsDay(key(TODAY),1),
   'CATEGORIES:'+icsEsc(t.list),
   'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(t.title),'TRIGGER;VALUE=DATE-TIME:'+icsStamp(new Date(new Date().setHours(13,0,0,0))),'END:VALARM',
   'END:VEVENT');
 });
 L.push('END:VCALENDAR');
 return L.join('\r\n');
}
function icsItems(){
 const out=[];
 S.events.forEach(e=>out.push({k:'ev',id:e.id,d:e.date,n:e.title,
  s:e.cat+(e.all_day?' \u00b7 all day':(e.time?' \u00b7 '+fmt(e.time):' \u00b7 no time'))+(e.who?' \u00b7 '+e.who:''),
  grp:e.series_id||('ev'+e.id)}));
 S.appts.filter(a=>a.active&&a.date).forEach(a=>out.push({k:'ap',id:a.id,d:a.date,
  n:(a.who?a.who+' \u2014 ':'')+a.what,s:'Appointment'+(a.time?' \u00b7 '+fmt(a.time):'')+(a.provider?' \u00b7 '+a.provider:''),grp:'ap'+a.id}));
 S.flows.filter(f=>f.kind==='out'&&!f.done).forEach(f=>out.push({k:'fl',id:f.id,d:f.date,
  n:f.title,s:'Bill \u00b7 '+money2(f.amount),grp:'fl'+f.id}));
 S.todos.filter(t=>!t.done).forEach(t=>out.push({k:'td',id:t.id,d:key(TODAY),
  n:t.title,s:t.list,grp:'td'+t.id}));
 return out.sort((a,b)=>a.d.localeCompare(b.d));
}

 if(loadFailed){
  const b=document.createElement('div');b.className='offline';
  b.innerHTML='Could not load everything \u2014 your data is safe. <button id="rl">Reload</button>';
  const host=document.getElementById('assist')||document.querySelector('.main');if(host)host.prepend(b);
  on('rl','onclick',()=>location.reload());
 }
 /* seed only on a confirmed-empty database */
 if(bl&&bl.length===0)await seedBills();
 if(ap&&ap.length===0)await seedAppts();
 if(inc&&inc.length===0)await seedIncome();
 await syncIncome();
 if(S.settings.paycheck)await syncPaychecks();
 render();
 const hr=new Date().getHours();
 if(!S.settings.paycheck&&!S.bills.length)setTimeout(openSetup,600);
 else if(hr<12&&!seen('jp_brief'))setTimeout(morningBrief,700);
 else if(hr>=19&&!seen('jp_evening'))setTimeout(eveningCheckin,700);
 }catch(err){console.error(err);
  const st=document.getElementById('stage');
  if(st)st.innerHTML='<div class="pane" style="padding:22px"><b>Something failed to load.</b><br><br><span style="font-size:12px;color:var(--muted)">'+(err&&err.message||err)+'</span></div>';}
})();

</script>
</body>
</html>
