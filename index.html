<!DOCTYPE html>
<html lang="en" data-theme="light" data-mode="life">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J Empire — The Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
[data-theme="light"]{
 --bg:#EFEAF4;--card:#FFF;--card2:#F8F5FB;
 --ink:#1C1622;--ink2:#3B3247;--muted:#655B71;--faint:#9C92A7;
 --line:#DBD2E5;--line2:#EAE4F0;
 --gold:#9C7A16;--gold-2:#7A5E10;--gold-soft:#F5EBD2;--gold-line:#D4BC7C;--ongold:#241C08;
 --appt-b:#E8D5D8;--appt-s:#8B4A56;
 --school-b:#D2D9E4;--school-s:#3E5480;
 --sports-b:#D5DDCE;--sports-s:#4E5C42;
 --personal-b:#E2D1DB;--personal-s:#74536A;
 --work-b:#DACFE7;--work-s:#5C4880;
 --gigs-b:#F0DCC8;--gigs-s:#9A5A22;
 --in-b:#D8EADE;--in-s:#22694A;--out-b:#F6DCDF;--out-s:#963648;
 --hi-b:#F7DDE1;--hi-s:#8E2B3E;--sm-b:#DDE4F2;--sm-s:#3B5488;--var-b:#EDE6F5;--var-s:#5C4880;
 --flower:#E1D6EC;--leaf:#D6DCD0;--gleaf:#EBDEBE;--fcore:#F8F4FB;--gop:.38;
}
[data-theme="dim"]{
 --bg:#CFC7DC;--card:#E4DDEC;--card2:#DAD2E6;
 --ink:#231C2E;--ink2:#3E3550;--muted:#5F5570;--faint:#8B819C;
 --line:#B9AECB;--line2:#C6BCD5;
 --gold:#8A6A12;--gold-2:#6E540C;--gold-soft:#E4D6B2;--gold-line:#B79E62;--ongold:#221A06;
 --appt-b:#DCC3C8;--appt-s:#7A3B47;
 --school-b:#C2CCDC;--school-s:#31456E;
 --sports-b:#C7D3BE;--sports-s:#3F4D34;
 --personal-b:#D6C1CE;--personal-s:#63435A;
 --work-b:#CBBEDD;--work-s:#4C3A70;
 --gigs-b:#E4CBB4;--gigs-s:#864A18;
 --in-b:#C3DBCB;--in-s:#1A5A3D;--out-b:#E9CBD0;--out-s:#822B3B;
 --hi-b:#E9C9CF;--hi-s:#7C2334;--sm-b:#C7D2E5;--sm-s:#2E4472;--var-b:#D4CADF;--var-s:#4C3A70;
 --flower:#C2B4D4;--leaf:#B9C3B2;--gleaf:#D3C4A4;--fcore:#E8E2F0;--gop:.48;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#g{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}#g svg{position:absolute}
.app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.hide{display:none!important}
.sec{display:flex;align-items:center;gap:10px;margin:0 0 9px;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-line),transparent)}
.box{width:18px;height:18px;border-radius:6px;border:2px solid var(--faint);background:var(--card);flex:0 0 auto;cursor:pointer}
.box.on{background:var(--gold);border-color:var(--gold);position:relative}
.box.on::after{content:"✓";position:absolute;inset:0;color:var(--ongold);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}

.bar{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.wm{font-family:'Pinyon Script',cursive;font-size:25px;color:var(--gold-2);flex:1;line-height:1.1}
.wm small{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-style:normal;font-weight:600;color:var(--ink2);letter-spacing:-.01em;margin-top:3px;line-height:1.3}
.ib{height:36px;padding:0 13px;border-radius:100px;background:var(--card);border:1.5px solid var(--line);cursor:pointer;font-size:12px;font-weight:700;color:var(--ink2);font-family:inherit;white-space:nowrap}
.mode,.tabs{display:grid;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:5px;margin-bottom:8px}
.mode{grid-template-columns:1fr 1fr}.tabs{grid-template-columns:repeat(3,1fr)}
[data-mode="money"] .tabs{grid-template-columns:repeat(4,1fr)}
.mode button,.tabs button{position:relative;border:0;background:transparent;border-radius:9px;padding:10px;font-family:inherit;font-size:13.5px;font-weight:800;color:var(--muted);cursor:pointer}
.mode button.on,.tabs button.on{background:var(--gold);color:var(--ongold)}
.badge{position:absolute;top:2px;right:6px;background:var(--hi-s);color:#fff;font-size:9px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* assistant */
.asstOK{display:flex;align-items:center;gap:10px;border-radius:13px;padding:10px 14px;margin-bottom:9px;border:1.5px solid var(--in-s);background:var(--in-b);font-size:12.5px;font-weight:800;color:var(--in-s)}
.asstC{overflow:hidden;margin-bottom:9px}
.ch2{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--card2);border-bottom:1px solid var(--line2);font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.ch2 b{margin-left:auto;font-size:11.5px;color:var(--hi-s)}
.cr{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line2)}
.cr:last-child{border-bottom:0}
.cr .sq{width:8px;height:8px;border-radius:3px;flex:0 0 auto;background:var(--sc)}
.cr .t{font-size:12.5px;font-weight:700;line-height:1.3}
.cr .v{margin-left:auto;font-size:12px;font-weight:800;color:var(--sc);flex:0 0 auto}
.cr.tapable{cursor:pointer}
.minibtn{border:0;background:var(--gold);color:var(--ongold);border-radius:10px;padding:12px 16px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;flex:0 0 auto}
.bdrow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card2);border:1px solid var(--line2);border-radius:10px;margin-bottom:5px;font-size:13px;font-weight:650}
.bdtag{font-size:8.5px;font-weight:800;letter-spacing:.06em;color:var(--gold-2);background:var(--gold-soft);border:1.5px solid var(--gold-line);border-radius:5px;padding:2px 6px;flex:0 0 auto}
.xrow{display:flex;align-items:center;gap:11px;padding:10px 13px;border-bottom:1px solid var(--line2);cursor:pointer}
.xrow:last-child{border-bottom:0}
.xrow.on{background:var(--gold-soft)}
.xrow .nm{font-size:13.5px;font-weight:700;line-height:1.2}
.xrow .sub{font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
.bdrow .x{margin-left:auto;color:var(--faint);font-size:15px;font-weight:700;cursor:pointer}
.cr .chev{font-size:15px;font-weight:800;color:var(--faint);flex:0 0 auto;margin-left:6px}
.moreb{width:100%;border:0;background:var(--card2);padding:9px;font-family:inherit;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;border-top:1px solid var(--line2)}

/* kid filter */
.kids{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;scrollbar-width:none}
.kids::-webkit-scrollbar{display:none}
.kids button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:100px;padding:7px 14px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.kids button.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold-2)}

.mhead{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 9px}
.mhead h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.035em;text-align:center}
.mhead .yr{font-size:9.5px;font-weight:800;letter-spacing:.15em;color:var(--muted);text-align:center;margin-top:1px}
.nav{border:1.5px solid var(--line);background:var(--card);border-radius:100px;width:34px;height:34px;font-size:16px;font-weight:700;color:var(--ink2);cursor:pointer;flex:0 0 auto}

.accs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:9px}
.acc{border-radius:12px;padding:8px 9px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.acc .nm{font-size:8.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.acc b{display:block;font-size:16px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.acc.sep{background:var(--sm-b);border-color:var(--sm-s)}.acc.sep b{color:var(--sm-s)}
.acc.short{border-color:var(--hi-s);background:var(--hi-b)}.acc.short b{color:var(--hi-s)}
.acc .flag{font-size:7.5px;font-weight:800;color:var(--hi-s);display:block;margin-top:2px}

.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.n{border-radius:13px;padding:9px 8px;text-align:center;border:1.5px solid var(--line);background:var(--card)}
.n span{display:block;font-size:8.5px;font-weight:800;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.n b{font-size:17px;font-weight:800;letter-spacing:-.03em}
.n.in{background:var(--in-b);border-color:var(--in-s)}.n.in b{color:var(--in-s)}
.n.out{background:var(--out-b);border-color:var(--out-s)}.n.out b{color:var(--out-s)}
.n.var{background:var(--var-b);border-color:var(--var-s)}.n.var b{color:var(--var-s)}
.n.end{background:var(--gold-soft);border-color:var(--gold-line)}.n.end b{color:var(--gold-2)}
.n.end.bad{background:var(--hi-b);border-color:var(--hi-s)}.n.end.bad b{color:var(--hi-s)}

.grid2{display:grid;gap:13px}
.dows{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:2px solid var(--gold-line)}
.dows div{font-size:9px;font-weight:800;letter-spacing:.09em;color:var(--muted);padding:0 0 5px 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(0,1fr)}
.c{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:4px;overflow:hidden;cursor:pointer}
.c:nth-child(7n){border-right:0}.c.dim{opacity:.22}
.c .d{font-size:13.5px;font-weight:700}
.c.today .d{background:var(--gold);color:var(--ongold);width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.c.sel{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--gold-line)}
.c.hasnote::after{content:"";position:absolute;top:0;right:0;width:0;height:0;
 border-style:solid;border-width:0 15px 15px 0;border-color:transparent var(--gold-line) transparent transparent}
.c.hasnote::before{content:"";position:absolute;top:0;right:0;width:0;height:0;z-index:1;
 border-style:solid;border-width:0 8px 8px 0;border-color:transparent var(--card) transparent transparent}
.c{position:relative}
.c .hol{font-size:8.5px;font-weight:600;color:var(--muted);line-height:1.15;margin:1px 0}
.chip{position:relative;border-radius:6px;padding:2px 4px 2px 7px;margin-top:2px;overflow:hidden;background:var(--eb);color:var(--ink);font-size:9.5px;font-weight:700;white-space:nowrap;text-overflow:ellipsis}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--es)}
.chip.allday{border-radius:4px;font-weight:800;text-align:center;padding-left:4px}
.chip.allday::before{display:none}
.amt{border-radius:5px;padding:1px 5px;margin-top:3px;font-size:9.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt.i{background:var(--in-b);color:var(--in-s)}
.amt.o{background:var(--out-b);color:var(--out-s)}
.amt.o.pd{opacity:.42;text-decoration:line-through}
.amt.ghost{background:transparent;border:1.5px dashed var(--hi-s);color:var(--hi-s)}
.pay{font-size:8.5px;font-weight:800;color:var(--in-s);margin-top:2px}

.dp{padding:13px 14px}
.dp h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em}
.dp .bal{font-size:9.5px;font-weight:800;letter-spacing:.09em;color:var(--muted);margin:3px 0 10px}
.dpr{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px;font-weight:700;cursor:pointer}
.dpr:last-child{border-bottom:0}
.dpr .v{margin-left:auto;font-weight:800}
.dpr .v.i{color:var(--in-s)}.dpr .v.o{color:var(--out-s)}
.dpr .sub{font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
.empty{font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 0}

.board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:13px}
.wcol{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-height:180px;display:flex;flex-direction:column}
.wcol.today{border:2px solid var(--gold)}
.wcol.wknd{background:var(--card2)}
.wch{padding:7px 4px 6px;text-align:center;border-bottom:1px solid var(--line2);background:var(--card2)}
.wcol.today .wch{background:var(--gold)}
.wch .dl{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.wch .dn{font-size:18px;font-weight:800}
.wcol.today .wch .dl,.wcol.today .wch .dn{color:var(--ongold)}
.wcb{padding:5px;display:flex;flex-direction:column;gap:4px;flex:1}
.wev{position:relative;border-radius:8px;padding:5px 5px 5px 9px;overflow:hidden;background:var(--eb);border:1px solid var(--line2);cursor:pointer}
.wev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--es)}
.wev .tm{font-size:8.5px;font-weight:800;color:var(--es)}
.wev .nm{font-size:11px;font-weight:700;line-height:1.2;color:var(--ink)}
.wcb .none{font-size:11px;font-weight:700;color:var(--faint);text-align:center;padding:10px 0}
.wcb .holn{font-size:9px;font-weight:600;color:var(--muted);text-align:center}

.grph{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--card2);border-bottom:1px solid var(--line2);font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.grph b{margin-left:auto;font-size:11px;color:var(--ink2)}
.grp ul{margin:0;padding:0}
.grp li{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2)}
.grp li:last-child{border-bottom:0}
.grp .t{font-size:13.5px;font-weight:700;line-height:1.25}
.grp .w{font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
.deprail{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;margin-bottom:2px}
.deprail::-webkit-scrollbar{display:none}
.dep{flex:0 0 auto;min-width:108px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 11px;cursor:pointer}
.dep .src{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dep .amt{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.dep .st{font-size:9.5px;font-weight:700;margin-top:3px}
.dep.on{border-color:var(--gold);background:var(--gold-soft)}
.dep.done .st{color:var(--in-s)}.dep.part .st{color:var(--gold-2)}.dep.untouched .st{color:var(--out-s)}
.cover{display:flex;align-items:center;gap:11px;border-radius:14px;padding:12px 15px;margin-bottom:10px;border:1.5px solid}
.cover.short{background:var(--hi-b);border-color:var(--hi-s)}
.cover.ok{background:var(--in-b);border-color:var(--in-s)}
.cover .ct{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.cover.short .ct{color:var(--hi-s)}.cover.ok .ct{color:var(--in-s)}
.cover .cs{font-size:11.5px;font-weight:600;color:var(--ink2);margin-top:2px}
.meter{padding:16px 16px 13px;text-align:center;border-bottom:1px solid var(--line2)}
.meter .lbl{font-size:9.5px;font-weight:800;letter-spacing:.13em;color:var(--muted)}
.meter .big{font-size:42px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:5px 0 3px}
.meter .of{font-size:11.5px;font-weight:600;color:var(--muted)}
.mbar{height:9px;border-radius:100px;background:var(--line2);overflow:hidden;display:flex;margin-top:12px}
.mbar i{height:100%}
.zero{background:var(--in-b);color:var(--in-s);border-radius:10px;padding:8px;font-size:12px;font-weight:800;letter-spacing:.05em;margin-top:11px}
.autobtn{width:100%;margin-top:11px;border:1.5px dashed var(--gold-line);background:var(--gold-soft);color:var(--gold-2);
 border-radius:11px;padding:11px;font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:.06em;cursor:pointer}
.shd{display:flex;align-items:center;gap:9px;padding:10px 15px;background:var(--card2);
 border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);
 font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.shd b{margin-left:auto;font-size:12px;color:var(--ink);letter-spacing:0}
.brow{padding:11px 14px;border-bottom:1px solid var(--line2)}
.brow:last-of-type{border-bottom:0}
.b1{display:flex;align-items:center;gap:10px}
.b1 .nm{font-size:14px;font-weight:700;line-height:1.2}
.b1 .sub{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:1px}
.b1 .need{margin-left:auto;text-align:right;flex:0 0 auto}
.b1 .need b{font-size:14px;font-weight:800;display:block;letter-spacing:-.02em}
.b1 .need span{font-size:10px;font-weight:700;color:var(--muted)}
.pbar{height:7px;border-radius:100px;background:var(--line2);overflow:hidden;margin-top:8px;display:flex}
.pbar .prior{height:100%;background:var(--sm-s);opacity:.55}
.pbar .thisone{height:100%;background:var(--in-s)}
.ctrl{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.ctrl button{border:1.5px solid var(--line);background:var(--card2);border-radius:9px;padding:7px 10px;
 font-family:inherit;font-size:11.5px;font-weight:800;color:var(--ink2);cursor:pointer;white-space:nowrap}
.ctrl button.fill{background:var(--gold);border-color:var(--gold);color:var(--ongold)}
.ctrl button:disabled{opacity:.35}
.ctrl .val{margin-left:auto;font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--in-s)}
.brow.full{background:var(--in-b)}
.legend{display:flex;gap:13px;padding:9px 14px;font-size:10.5px;font-weight:700;color:var(--muted);border-top:1px solid var(--line2)}
.legend s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;text-decoration:none}
.pick{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line2)}
.pick .nav{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer}
.pick .nav:disabled{opacity:.3}
.pick .mid{flex:1;text-align:center;min-width:0}
.pick .mid b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.pick .mid span{font-size:9.5px;font-weight:800;letter-spacing:.09em;color:var(--muted)}
.gauge{padding:14px 15px}
.gnum{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.gnum b{font-size:30px;font-weight:800;letter-spacing:-.035em}
.gnum .of{font-size:12.5px;font-weight:600;color:var(--muted)}
.gbar{height:12px;border-radius:100px;background:var(--line2);overflow:hidden;margin:12px 0 8px;display:flex}
.gbar i{height:100%}
.glegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;font-weight:700;color:var(--ink2)}
.glegend s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;text-decoration:none}
.srow{display:flex;align-items:center;gap:12px;padding:11px 15px;border-top:1px solid var(--line2);cursor:pointer}
.srow .nm{font-size:14px;font-weight:700;line-height:1.2}
.srow .sub{font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.srow .amt{margin-left:auto;font-size:14.5px;font-weight:800;text-align:right}

 const byD={};up.filter(e=>e.time).forEach(e=>(byD[e.date]=byD[e.date]||[]).push(e));
 const clash=[];
 Object.entries(byD).forEach(([d,l])=>{l.sort((a,b)=>a.time.localeCompare(b.time));
  for(let i=1;i<l.length;i++)if(l[i].time===l[i-1].time)clash.push(l[i],l[i-1])});
 if(clash.length)A.push({sc:'var(--hi-s)',t:'Double-booked',v:[...new Set(clash.map(e=>parse(e.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})))].join(', '),
  items:[...new Set(clash)].map(e=>({kind:'event',id:e.id,n:e.title,s:parse(e.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' \u00b7 '+fmt(e.time)}))});
 const seen=new Set(),heavy=[];
 up.forEach(e=>{if(seen.has(e.date))return;const n=S.events.filter(x=>x.date===e.date).length;
  if(n>=HEAVY){seen.add(e.date);heavy.push({d:e.date,n})}});
 heavy.forEach(h=>A.push({sc:'var(--gold-2)',t:parse(h.d).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+' is loaded',v:h.n+' things',
  items:S.events.filter(x=>x.date===h.d).map(e=>({kind:'event',id:e.id,n:e.title,s:(e.time?fmt(e.time):'no time')+(e.who?' \u00b7 '+e.who:'')}))}));
 const nt=up.filter(e=>!e.time&&!e.all_day);
 if(nt.length)A.push({sc:'var(--gold-2)',t:nt.length+' upcoming event'+(nt.length>1?'s have':' has')+' no time',v:'',

 const book=S.appts.filter(a=>a.active&&!a.date);
 if(book.length)A.push({sc:'var(--hi-s)',t:book.length+' appointment'+(book.length>1?'s':'')+' need booking',v:'',

 return A;
}

/* ---- LIFE ---- */
function calCells(build){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 let h='';for(let i=0;i<first;i++)h+='<div class="c dim"></div>';
 for(let d=1;d<=days;d++)h+=build(new Date(y,m,d),d);
 const rows=Math.ceil((first+days)/7);
 for(let i=first+days;i<rows*7;i++)h+='<div class="c dim"></div>';
 return h;
}
function lifeMonth(){
 const cells=calCells((dt,d)=>{
  const k=key(dt),ev=evOn(dt),ho=HOL[k],pay=PAY.has(k);
  const chips=ev.slice(0,2).map(e=>`<div class="chip ${e.all_day?'allday':''}" style="--eb:var(--${CATS[e.cat]}-b);--es:var(--${CATS[e.cat]}-s)">${e.title}</div>`).join('')
   +(ev.length>2?`<div class="chip" style="--eb:transparent;--es:transparent;color:var(--muted)">+${ev.length-2}</div>`:'');
  const dots=`<div class="dots">${pay?'<i style="--es:var(--in-s)"></i>':''}${ev.slice(0,3).map(e=>`<i style="--es:var(--${CATS[e.cat]}-s)"></i>`).join('')}</div>`;
  return `<div class="c${same(dt,TODAY)?' today':''}${same(dt,S.sel)?' sel':''}${(S.notes[k]||'').trim()?' hasnote':''}" data-d="${k}"><div class="d">${d}</div>
   ${ho?`<div class="hol">(${ho})</div>`:''}${pay?'<div class="pay">PAYDAY</div>':''}${chips}${dots}</div>`;
 });
 const ev=evOn(S.sel),k=key(S.sel);
 return `<div class="grid2"><div>
  <div class="dows"><div>SU</div><div>MO</div><div>TU</div><div>WE</div><div>TH</div><div>FR</div><div>SA</div></div>
  <div class="cal">${cells}</div></div>
  <div><div class="card dp" style="margin-bottom:11px">
   <h3>${S.sel.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h3>
   <div class="bal">${ev.length} EVENT${ev.length===1?'':'S'}${HOL[k]?' · '+HOL[k].toUpperCase():''}${PAY.has(k)?' · PAYDAY':''}</div>
   ${ev.length?ev.map(e=>evRow(e)).join(''):'<div class="empty">Nothing on this day.</div>'}</div>
   ${railHTML()}</div></div>`;
}
const evRow=e=>`<div class="dpr" data-ev="${e.id}"><div><div>${e.title}</div>
 <div class="sub">${e.cat}${e.all_day?' · all day':(e.time?' · '+fmt(e.time):'')}${e.who?' · '+e.who:''}${e.location?' · '+e.location:''}</div></div></div>`;
function lifeWeek(){
 const a=new Date(S.cursor);a.setDate(a.getDate()-a.getDay());
 let cols='';
 for(let i=0;i<7;i++){
  const d=new Date(a);d.setDate(d.getDate()+i);
  const ev=evOn(d),k=key(d),ho=HOL[k],pay=PAY.has(k);
  const body=(ho?`<div class="holn">(${ho})</div>`:'')+(pay?`<div class="wev" style="--eb:var(--in-b);--es:var(--in-s)"><div class="tm">INCOME</div><div class="nm">Payday</div></div>`:'')
   +ev.map(e=>`<div class="wev" data-ev="${e.id}" style="--eb:var(--${CATS[e.cat]}-b);--es:var(--${CATS[e.cat]}-s)">
     <div class="tm">${e.all_day?'ALL DAY':(e.time?fmt(e.time):e.cat.toUpperCase())}${e.who?' · '+e.who:''}</div>
     <div class="nm">${e.title}</div></div>`).join('')||'<div class="none">—</div>';
  cols+=`<div class="wcol ${same(d,TODAY)?'today':''} ${[0,6].includes(d.getDay())?'wknd':''}">
   <div class="wch"><div class="dl">${d.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase()}</div><div class="dn">${d.getDate()}</div></div>
   <div class="wcb">${body}</div></div>`;
 }
 const items=[];
 const upcoming=S.events.filter(kidOK).filter(e=>dd(parse(e.date))>=0);
 const bySeries={},solo=[];
 upcoming.forEach(e=>{if(e.series_id){(bySeries[e.series_id]=bySeries[e.series_id]||[]).push(e)}else solo.push(e)});
 Object.values(bySeries).forEach(fam=>{
  fam.sort((a,b)=>a.date.localeCompare(b.date));
  const nx=fam[0],last=fam[fam.length-1];
  if(fam.length===1){items.push({t:nx.title,w:nx.cat+(nx.time?' · '+fmt(nx.time):'')+(nx.who?' · '+nx.who:''),d:dd(parse(nx.date)),id:nx.id});return}
  const dows=[...new Set(fam.slice(0,8).map(x=>parse(x.date).toLocaleDateString(undefined,{weekday:'short'})))].join(', ');
  items.push({t:nx.title,w:`${nx.cat}${nx.time?' · '+fmt(nx.time):''}${nx.who?' · '+nx.who:''} — ${dows} through ${parse(last.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}`,
   d:dd(parse(nx.date)),id:nx.id,n:fam.length});
 });
 solo.forEach(e=>items.push({t:e.title,w:e.cat+(e.time?' · '+fmt(e.time):'')+(e.who?' · '+e.who:''),d:dd(parse(e.date)),id:e.id}));
 S.todos.filter(t=>!t.done).forEach(t=>items.push({t:t.title,w:t.list,d:null}));
 const far=items.filter(x=>x.d!==null&&x.d>14).length;
 const near=items.filter(x=>x.d===null||x.d<=14);
 const G=[['TODAY',x=>x.d===0],['TOMORROW',x=>x.d===1],['THIS WEEK',x=>x.d>1&&x.d<=7],['NEXT WEEK',x=>x.d>7&&x.d<=14],['NO DATE',x=>x.d===null]];
 const cdT=n=>n===null?'no date':n===0?'today':n===1?'tomorrow':'in '+n+' days';
 let list='';
 G.forEach(([nm,f])=>{const l=near.filter(f);if(!l.length)return;
  l.sort((x,y)=>(x.d==null?999:x.d)-(y.d==null?999:y.d));
  list+=`<div class="grph">${nm}<b>${l.length}</b></div><ul>`+l.map(x=>
   `<li${x.id?` data-ev="${x.id}"`:''}><span class="box"></span><div><div class="t">${x.t}${x.n?` <span class="rep">×${x.n}</span>`:''}</div><div class="w">${x.w}</div></div><span class="cd">${cdT(x.d)}</span></li>`).join('')+'</ul>'});
 if(far)list+=`<div class="grph" style="justify-content:center;color:var(--muted)">${far} more further out — see Month</div>`;
 return `<div class="grid2"><div><div class="board">${cols}</div>
  <div class="sec">WHAT'S COMING</div><div class="card grp">${list||'<div class="empty" style="padding:20px 14px;text-align:center">Nothing yet.</div>'}</div></div>
  <div>${railHTML()}</div></div>`;
}
function lifeDay(){
 const d=S.sel,ev=evOn(d);
 const ad=ev.filter(e=>e.all_day||!e.time);
 const timed=ev.filter(e=>e.time&&!e.all_day);
 const H=[];for(let i=6;i<=21;i++)H.push(i);
 const nowT=new Date().getHours()+new Date().getMinutes()/60;
 const note=S.notes[key(d)]||'';
 let grid;
 if(window.innerWidth<820){
  /* ---- phone: one column, no sideways scrolling ---- */
  let rows=`<div class="hcol">${H.map(h=>`<div class="hlab">${fmt(h+':00')}</div>`).join('')}</div>`;
  const lanes=[];
  const slots=timed.map(e=>{
   const[hh,mm]=e.time.split(':').map(Number);const st=(hh+mm/60);
   let lane=0;while(lanes[lane]!==undefined&&lanes[lane]>st)lane++;
   lanes[lane]=st+1;
   const w=Math.max(1,lanes.filter(x=>x!==undefined).length);
   return`<div class="slot1" data-ev="${e.id}" style="top:${(st-6)*46+1}px;--eb:var(--${CATS[e.cat]}-b);--es:var(--${CATS[e.cat]}-s);left:${lane*(100/Math.max(w,1))}%;width:calc(${100/Math.max(w,1)}% - 5px)">
    <div class="t">${fmt(e.time)} \u00b7 ${e.cat}${e.who?' \u00b7 '+e.who:''}</div><div class="n">${e.title}</div></div>`}).join('');
  rows+=`<div class="hcol lane">${H.map(()=>'<div class="hr"></div>').join('')}${slots}</div>`;
  if(same(d,TODAY)&&nowT>=6&&nowT<=21)rows+=`<div class="nowline1" style="top:${(nowT-6)*46}px"></div>`;
  grid=`<div class="card"><div class="tl1">${rows}</div></div>`;
  if(ad.length)grid=`<div class="adband">${ad.map(e=>`<div class="u" data-ev="${e.id}" style="--eb:var(--${CATS[e.cat]}-b);--es:var(--${CATS[e.cat]}-s)">
   <b>${e.title}</b><span>${e.all_day?'all day':'no time'} \u00b7 ${e.cat}${e.who?' \u00b7 '+e.who:''}</span></div>`).join('')}</div>`+grid;
 }else{
  /* ---- iPad: category lanes ---- */
  let body=`<div class="hcol">${H.map(h=>`<div class="hlab">${fmt(h+':00')}</div>`).join('')}</div>`;
  CATLIST.forEach(c=>{
   const r=H.map(()=>'<div class="hr"></div>').join('');
   const sl=timed.filter(e=>e.cat===c).map(e=>{const[hh,mm]=e.time.split(':').map(Number);
    return`<div class="slot" data-ev="${e.id}" style="top:${((hh+mm/60)-6)*46+1}px;height:44px;--eb:var(--${CATS[c]}-b);--es:var(--${CATS[c]}-s)">
     <div class="t">${fmt(e.time)}${e.who?' \u00b7 '+e.who:''}</div><div class="n">${e.title}</div></div>`}).join('');
   body+=`<div class="hcol">${r}${sl}</div>`});
  if(same(d,TODAY)&&nowT>=6&&nowT<=21)body+=`<div class="nowline" style="top:${(nowT-6)*46}px"></div>`;
  const adRow=`<div class="adrow"><div class="adlab">ALL DAY</div>${CATLIST.map(c=>{
   const l=ad.filter(e=>e.cat===c);
   return`<div class="adcell">${l.map(e=>`<div class="adchip" data-ev="${e.id}" style="--eb:var(--${CATS[c]}-b);--es:var(--${CATS[c]}-s)">${e.title}${e.all_day?'':' <span style="opacity:.6">\u00b7 no time</span>'}</div>`).join('')}</div>`}).join('')}</div>`;
  grid=`<div class="card tlwrap"><div class="tlgrid">
   <div class="tlhead"><div></div>${CATLIST.map(c=>`<div><span class="dot" style="background:var(--${CATS[c]}-s)"></span>${c.toUpperCase()}</div>`).join('')}</div>
   ${ad.length?adRow:''}<div class="tlbody">${body}</div></div></div>`;
 }
 return `<div class="grid2"><div>${grid}</div>
  <div><div class="card preview" id="noteCard">
   <div class="plbl">\u270e NOTE \u00b7 ${d.toLocaleDateString(undefined,{month:'short',day:'numeric'}).toUpperCase()}<span class="edit">${note.trim()?'Edit \u203a':'Add \u203a'}</span></div>
   ${note.trim()?`<div class="ptxt">${note.split('\n').filter(Boolean).slice(0,3).map((l,i)=>`<span class="ln">${i+1}</span>${l}`).join('<br>')}</div>`
    :'<div class="pempty">Nothing written for this day.</div>'}
  </div>${railHTML()}</div></div>`;
}

 const L=['To-Do','To Buy','To Call'],C={'To-Do':'#6E5A8A','To Buy':'#845F66','To Call':'#4E5C42'};

/* ================= BINDINGS ================= */
const allocFor=id=>S.alloc.filter(a=>a.income_id==id);
const spentOf=id=>allocFor(id).reduce((s2,a)=>s2+(+a.amount||0),0);
const paidOn=bid=>S.alloc.filter(a=>a.bill_id==bid).reduce((s2,a)=>s2+(+a.amount||0),0);
const allocAmt=(inc,bid)=>{const a=S.alloc.find(x=>x.income_id==inc&&x.bill_id==bid);return a?+a.amount||0:0};
async function setAlloc(inc,bid,amt){
 const ex=S.alloc.find(x=>x.income_id==inc&&x.bill_id==bid);
 if(amt<=0){if(ex){S.alloc=S.alloc.filter(x=>x!==ex);await dbDel('jp_alloc',ex.id)}return}
 if(ex){ex.amount=amt;await dbSet('jp_alloc',ex.id,{amount:amt})}
 else{const r=await dbAdd('jp_alloc',{income_id:inc,bill_id:bid,amount:amt});if(r&&r[0])S.alloc.push(r[0])}
}
/* month-wide: does all income cover all bills */
function monthCoverage(){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 const inM=f=>{const d=parse(f.date);return d.getFullYear()===y&&d.getMonth()===m};
 const deps=S.flows.filter(f=>f.kind==='in'&&inM(f));
 const bills=S.flows.filter(f=>f.kind==='out'&&!f.done&&!isGas(f)&&(inM(f)||parse(f.date)<new Date(y,m,1)));
 const owed=bills.reduce((s2,b)=>s2+Math.max(0,(+b.amount||0)-paidOn(b.id)),0);
 const unassigned=deps.reduce((s2,d)=>s2+Math.max(0,(+d.amount||0)-spentOf(d.id)),0);
 const days=new Date(y,m+1,0).getDate();
 const spend=Math.round((+S.settings.weekly_spend||0)*(days/7));
 return{owed,unassigned,short:owed-unassigned,spend,deps,bills};
}
function incomeEvents(){
 return S.flows.filter(f=>f.kind==='in').sort((a,b)=>a.date.localeCompare(b.date));
}
function moneySplit(){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 const inM=f=>{const d=parse(f.date);return d.getFullYear()===y&&d.getMonth()===m};
 const deps=S.flows.filter(f=>f.kind==='in'&&inM(f)).sort((a,b)=>a.date.localeCompare(b.date));
 if(!deps.length)return `<div class="card" style="padding:26px 18px;text-align:center">
  <div style="font-size:14px;font-weight:700;margin-bottom:6px">No deposits this month</div>
  <div style="font-size:12.5px;color:var(--muted);font-weight:600">Set your amounts in the In tab and they will fill in here.</div></div>`;
 let idx=S.splitIdx;
 if(idx==null||idx>=deps.length){idx=deps.findIndex(d=>parse(d.date)>=TODAY);if(idx<0)idx=deps.length-1}
 S.splitIdx=idx;
 const cur=deps[idx];
 const bills=S.flows.filter(f=>f.kind==='out'&&!f.done&&!isGas(f)&&(inM(f)||parse(f.date)<new Date(y,m,1)))
  .sort((a,b)=>a.date.localeCompare(b.date));
 const used=spentOf(cur.id),rem=(+cur.amount||0)-used;
 const C=monthCoverage();
 const COL=['var(--in-s)','var(--lav)','var(--gold)','var(--out-s)','var(--sm-s)','var(--gigs-s)'];

 const depRows=deps.map((d,i)=>{
  const sp=spentOf(d.id),lf=(+d.amount||0)-sp;
  const cls=sp===0?'none':(lf<=0.5?'all':'some');
  const txt=sp===0?'not assigned':(lf<=0.5?'all assigned':money(lf)+' left');
  return `<div class="drow ${i===idx?'on':''}" data-dep="${i}">
   <div style="min-width:0"><div class="dnm">${d.title}</div>
   <div class="dsub ${cls}">${parse(d.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})} \u00b7 ${txt}</div></div>
   <div class="damt">${money(d.amount)}</div></div>`}).join('');

 const mine=allocFor(cur.id);
 const receipt=`<div class="rc"><div class="rch">THIS DEPOSIT GOES TO</div>
  ${mine.length?mine.map(a=>{const b=S.flows.find(x=>x.id==a.bill_id);
   return `<div class="rrow"><span>${b?b.title:'—'}</span><span class="dots"></span><span class="rv">${money2(a.amount)}</span></div>`}).join('')
   :'<div class="rempty">Nothing assigned yet.</div>'}
  <div class="rtot"><span>LEFT</span><span class="dots"></span><span>${money(rem)}</span></div></div>`;

 const track=mine.map((a,n)=>`<i style="width:${+cur.amount?a.amount/cur.amount*100:0}%;background:${COL[n%COL.length]}"></i>`).join('');

 const row=b=>{
  const total=+b.amount||0,my=allocAmt(cur.id,b.id),prior=paidOn(b.id)-my;
  const owed=total-prior-my,full=owed<=0.5,late=dd(parse(b.date))<0;
  return `<div class="brow ${full?'full':''}">
   <div class="b1"><div style="min-width:0"><div class="bnm">${b.title}</div>
    <div class="bd">${late?Math.abs(dd(parse(b.date)))+' days late':'Due '+parse(b.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})} \u00b7 ${money2(total)} total</div></div>
    <div class="owe"><b>${full?'Paid off':money2(owed)}</b><span>${full?'':'still owed'}</span></div></div>
   <div class="pb"><i style="width:${total?prior/total*100:0}%;background:var(--sm-s);opacity:.5"></i>
    <i style="width:${total?my/total*100:0}%;background:var(--in-s)"></i></div>
   ${full?'':`<div class="btns">
    <button data-add="${b.id}|50" ${rem<50?'disabled':''}>+50</button>
    <button data-add="${b.id}|100" ${rem<100?'disabled':''}>+100</button>
    <button class="p" data-cover="${b.id}" ${rem<=0?'disabled':''}>Cover it</button>
    ${my?`<button data-clr="${b.id}">Clear</button><span class="bv">${money2(my)}</span>`:''}</div>`}</div>`};
 const open=bills.filter(b=>(+b.amount||0)-paidOn(b.id)>0.5);
 const closed=bills.filter(b=>(+b.amount||0)-paidOn(b.id)<=0.5);

 const cov=C.short>0
  ? `<div class="cover short"><div><b>Short ${money(C.short)} this month</b>
     <span>${money(C.owed)} in bills \u00b7 ${money(C.unassigned)} of your deposits still free</span></div></div>`
  : `<div class="cover ok"><div><b>Everything is covered</b>
     <span>${money(Math.abs(C.short))} left across all deposits after bills</span></div></div>`;

 return `${cov}
 <div class="card splitwrap">
  <div class="two">
   <div class="left">
    <div class="lh">THIS MONTH'S DEPOSITS</div>${depRows}
    <div style="border-top:1.5px solid var(--line2)">${receipt}</div>
   </div>
   <div class="right">
    <div class="pin">
     <div class="pl">LEFT TO ASSIGN</div>
     <div class="pn" style="color:${rem<=0.5?(rem<-0.5?'var(--hi-s)':'var(--in-s)'):'var(--ink)'}">${money(rem)}</div>
     <div class="po">of ${money(cur.amount)} \u00b7 ${cur.title}, ${parse(cur.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>
     <div class="ptrack">${track}</div>
     ${!+cur.amount?'<div class="warn" style="margin-top:10px">No amount on this deposit \u2014 set it in the In tab.</div>':''}
     ${rem>0.5?'<button class="guide" id="autoSplit">GUIDE ME \u2014 ASSIGN BY DUE DATE</button>':''}
    </div>
    <div class="blist">
     ${bills.length?open.map(row).join('')+closed.map(row).join('')
      :'<div class="empty" style="padding:22px 14px;text-align:center">No unpaid bills this month.</div>'}
    </div>
   </div>
  </div>
 </div>`;
}
function bindStage(){
 document.querySelectorAll('.c[data-d]').forEach(c=>c.onclick=()=>{S.sel=parse(c.dataset.d);render()});
 document.querySelectorAll('[data-paid]').forEach(el=>el.onclick=async e=>{e.stopPropagation();
  const f=S.flows.find(x=>x.id==el.dataset.paid);if(!f)return;
  f.done=!f.done;await dbSet('jp_flows',f.id,{done:f.done});render()});
 document.querySelectorAll('[data-dep]').forEach(el=>el.onclick=()=>{S.splitIdx=+el.dataset.dep;render()});
 const curDep=()=>{const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
  const deps=S.flows.filter(f=>f.kind==='in'&&parse(f.date).getFullYear()===y&&parse(f.date).getMonth()===m)
   .sort((a,b)=>a.date.localeCompare(b.date));return deps[S.splitIdx||0]};
 const owedOn=b=>(+b.amount||0)-paidOn(b.id);
 document.querySelectorAll('[data-add]').forEach(el=>el.onclick=async()=>{
  const [bid,v]=el.dataset.add.split('|');const d=curDep();if(!d)return;
  const b=S.flows.find(x=>x.id==bid);
  const free=(+d.amount||0)-spentOf(d.id);
  const give=Math.min(+v,free,owedOn(b));
  if(give<=0){toast('Nothing left on this deposit');return}
  await setAlloc(d.id,b.id,allocAmt(d.id,b.id)+give);render()});
 document.querySelectorAll('[data-cover]').forEach(el=>el.onclick=async()=>{
  const d=curDep();if(!d)return;const b=S.flows.find(x=>x.id==el.dataset.cover);
  const free=(+d.amount||0)-spentOf(d.id),owed=owedOn(b);
  const give=Math.min(owed,free);
  if(give<owed)toast('Only '+money(free)+' left \u2014 covered part of it');
  await setAlloc(d.id,b.id,allocAmt(d.id,b.id)+give);render()});
 document.querySelectorAll('[data-clr]').forEach(el=>el.onclick=async()=>{
  const d=curDep();if(!d)return;await setAlloc(d.id,el.dataset.clr,0);render()});
 const au=document.getElementById('autoSplit');
 if(au)au.onclick=async()=>{
  const d=curDep();if(!d)return;
  const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
  const bills=S.flows.filter(f=>f.kind==='out'&&!f.done&&!isGas(f)&&

function incomeDates(src,from,to){
 const out=[];if(!src.anchor||src.freq==='none')return out;
 let d=parse(src.anchor);
 while(d>from){const p=new Date(d);
  if(src.freq==='biweekly')p.setDate(p.getDate()-14);
  else if(src.freq==='monthly')p.setMonth(p.getMonth()-1);
  else if(src.freq==='weekly')p.setDate(p.getDate()-7);
  else break;
  if(p<from)break;d=p}
 while(d<from){if(src.freq==='biweekly')d.setDate(d.getDate()+14);
  else if(src.freq==='monthly')d.setMonth(d.getMonth()+1);
  else if(src.freq==='weekly')d.setDate(d.getDate()+7);else break}
 let guard=0;
 while(d<=to&&guard++<200){out.push(key(d));
  if(src.freq==='biweekly')d.setDate(d.getDate()+14);
  else if(src.freq==='monthly')d.setMonth(d.getMonth()+1);
  else if(src.freq==='weekly')d.setDate(d.getDate()+7);else break}
 return out;
}

function icsEsc(t){return String(t||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n')}
function icsStamp(d){const p=n=>String(n).padStart(2,'0');
 return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+p(d.getUTCHours())+p(d.getUTCMinutes())+'00Z'}
function icsLocal(dateStr,timeStr){const p=n=>String(n).padStart(2,'0');
 const d=parse(dateStr);const[h,mi]=(timeStr||'00:00').split(':').map(Number);
 return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(h)+p(mi)+'00'}
function icsDay(dateStr,plus){const d=parse(dateStr);if(plus)d.setDate(d.getDate()+plus);
 const p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())}

  const base={title:eT.value.trim(),cat,date:eD.value,end_date:eED.value||null,
   time:allDay?null:(eTm.value||null),all_day:allDay,who:who||null,
   location:eLoc.value||null,leave_by:allDay?null:(eL.value||null)};
  if(isNew){
   const rep=eR.value,until=eRE.value?parse(eRE.value):null,sd=rep==='weekly'?sid():null;
   let d=parse(eD.value),count=0;
   do{
    const r=await dbAdd('jp_events',{...base,date:key(d),series_id:sd,series_end:eRE.value||null});
    if(r&&r[0])S.events.push(r[0]);
    d=new Date(d);d.setDate(d.getDate()+7);count++;
   }while(rep==='weekly'&&until&&d<=until&&count<60);
  }else if(scope==='all'&&e.series_id){
   const fam=S.events.filter(x=>x.series_id===e.series_id&&x.date>=e.date);
   for(const x of fam){const patch={...base,date:x.date};Object.assign(x,patch);await dbSet('jp_events',x.id,patch)}
  }else{Object.assign(e,base);await dbSet('jp_events',e.id,base)}
  S.sel=parse(eD.value);S.cursor=new Date(S.sel);closeSheet();render()};
 if(!isNew)eDel.onclick=async()=>{
  if(scope==='all'&&e.series_id){
   if(!confirm('Delete this and all after?'))return;
   S.events=S.events.filter(x=>!(x.series_id===e.series_id&&x.date>=e.date));
   await dbDelSeries('jp_events',e.series_id,e.date);
  }else{if(!confirm('Delete '+e.title+'?'))return;
   S.events=S.events.filter(x=>x.id!==e.id);await dbDel('jp_events',e.id)}
  closeSheet();render()};
}

/* ================= MENU ================= */
document.getElementById('moreBtn').onclick=()=>{
 openSheet(`<h3>More</h3><div class="sd">Check-ins, backup, setup</div>
  <button class="addrow" id="briefB" style="margin-top:0">MORNING BRIEF</button>
  <button class="addrow" id="eveB">EVENING CHECK-IN</button>
  <button class="addrow" id="notesB">NOTES \u00b7 ${Object.values(S.notes).filter(v=>(v||'').trim()).length}</button>
  <button class="addrow" id="icsB">SEND TO APPLE CALENDAR</button>
  <button class="addrow" id="expB">EXPORT BACKUP FILE</button>
  <button class="addrow" id="setupB">FIRST-TIME SETUP</button>
  <div class="acts"><button class="cancel" data-close style="grid-column:1/-1">CLOSE</button></div>`);
 briefB.onclick=()=>{closeSheet();morningBrief()};
 eveB.onclick=()=>{closeSheet();eveningCheckin()};
 icsB.onclick=()=>{closeSheet();exportICS()};
 notesB.onclick=()=>{closeSheet();openNotes()};
 expB.onclick=()=>{
  const blob=new Blob([JSON.stringify({events:S.events,todos:S.todos,flows:S.flows,bills:S.bills,accounts:S.accounts,appts:S.appts,settings:S.settings,notes:S.notes},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='jempire-planner-'+key(new Date())+'.json';a.click();toast('Exported')};
 setupB.onclick=()=>{closeSheet();openSetup()};
};
function openNote(d){
 const k=key(d),cur=S.notes[k]||'';
 openSheet(`<h3>Note</h3><div class="sd">${d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase()}</div>
  <div class="fld"><label>WHAT HAPPENED</label>
   <div class="padwrap"><div class="gutter" id="gut"></div><textarea class="pad" id="padTa" placeholder="One line per thing\u2026">${cur}</textarea></div></div>
  <div class="acts three"><button class="del" id="nDel" ${cur?'':'style="opacity:.4"'}>DELETE</button>
   <button class="cancel" data-close>CANCEL</button><button class="save" id="nSave">SAVE</button></div>`);
 const ta=document.getElementById('padTa'),gut=document.getElementById('gut');
 const nums=()=>{const n=Math.max(6,(ta.value||'').split('\n').length);
  gut.innerHTML=Array.from({length:n},(_,i)=>`<span>${i+1}</span>`).join('')};
 ta.oninput=nums;ta.onscroll=()=>{gut.scrollTop=ta.scrollTop};nums();
 document.getElementById('nSave').onclick=async()=>{
  S.notes[k]=ta.value;await dbNote(k,ta.value);closeSheet();render();toast('Saved')};
 document.getElementById('nDel').onclick=async()=>{
  if(!cur)return;if(!confirm('Delete this note?'))return;
  delete S.notes[k];await dbNote(k,'');closeSheet();render()};
}
function openNotes(){
 const keys=Object.keys(S.notes).filter(k=>(S.notes[k]||'').trim()).sort().reverse();
 const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
 openSheet(`<h3>Notes</h3><div class="sd">${keys.length} day${keys.length===1?'':'s'} written on</div>
  <div class="search">\ud83d\udd0d<input id="nq" placeholder="Search your notes\u2026"></div>
  <div class="card" id="nlist" style="overflow:hidden;max-height:56vh;overflow-y:auto"></div>
  <div class="acts"><button class="cancel" data-close style="grid-column:1/-1">CLOSE</button></div>`);
 const paint=()=>{
  const q=(document.getElementById('nq').value||'').trim().toLowerCase();
  const rows=keys.filter(k=>!q||S.notes[k].toLowerCase().includes(q));
  document.getElementById('nlist').innerHTML=rows.length?rows.map(k=>{
   const d=parse(k);let t=S.notes[k];
   if(q){const i=t.toLowerCase().indexOf(q);
    t=t.slice(0,i)+'<mark>'+t.slice(i,i+q.length)+'</mark>'+t.slice(i+q.length)}
   const ev=S.events.filter(e=>e.date===k).map(e=>e.title).join(' \u00b7 ');
   return `<div class="nrow" data-nd="${k}"><div class="ndate"><div class="dd">${d.getDate()}</div><div class="mm">${MON[d.getMonth()]}</div></div>
    <div class="nbody"><div class="txt">${t}</div>${ev?`<div class="meta">${ev.toUpperCase()}</div>`:''}</div></div>`
  }).join(''):'<div class="nrow"><div class="nbody"><div class="txt" style="color:var(--muted)">'+(keys.length?'Nothing matches.':'No notes yet \u2014 write one on any day.')+'</div></div></div>';
  document.querySelectorAll('[data-nd]').forEach(el=>el.onclick=()=>{
   S.sel=parse(el.dataset.nd);S.cursor=new Date(S.sel);S.mode='life';S.view='day';closeSheet();render()});
  document.querySelectorAll('.nbody .txt').forEach(t=>{});
 };
 document.getElementById('nq').oninput=paint;paint();
}
function openSetup(){
 openSheet(`<h3>First-time setup</h3><div class="sd">Four numbers and you're running.</div>
  <div class="fld"><label>PAYCHECK AMOUNT (EVERY OTHER FRIDAY)</label><input id="s1" type="number" inputmode="decimal" value="${S.settings.paycheck||''}"></div>
  <div class="fld"><label>CUSHION — END EACH MONTH WITH AT LEAST</label><input id="s2" type="number" inputmode="decimal" value="${S.settings.cushion||''}"></div>
  <div class="fld"><label>TYPICAL SPENDING PER WEEK</label><input id="s3" type="number" inputmode="decimal" value="${S.settings.weekly_spend||''}"></div>
  <div class="fld"><label>NAVY FEDERAL BALANCE RIGHT NOW</label><input id="s4" type="number" inputmode="decimal" value="${(S.accounts.find(a=>a.name==='Navy Federal')||{}).balance||''}"></div>
  <div class="acts"><button class="cancel" data-close>LATER</button><button class="save" id="sS">SAVE</button></div>`);
 sS.onclick=async()=>{
  S.settings.paycheck=+s1.value||0;S.settings.cushion=+s2.value||0;S.settings.weekly_spend=+s3.value||0;
  await dbSet('jp_settings',1,{paycheck:S.settings.paycheck,cushion:S.settings.cushion,weekly_spend:S.settings.weekly_spend});
  const nf=S.accounts.find(a=>a.name==='Navy Federal');
  if(nf){nf.balance=+s4.value||0;await dbSet('jp_accounts',nf.id,{balance:nf.balance})}
  await syncPaychecks();closeSheet();render();toast('Ready')};
}

/* ================= BOOT ================= */
document.getElementById('fab').onclick=()=>S.mode==='money'?openFlow(null,'out'):openEvent(null);
document.getElementById('todayBtn').onclick=()=>{S.cursor=new Date();S.sel=new Date();render()};
document.getElementById('themeBtn').onclick=async()=>{
 const dim=document.documentElement.dataset.theme==='dim';
 const t=dim?'light':'dim';document.documentElement.dataset.theme=t;
 document.getElementById('themeBtn').textContent=dim?'☀ Light':'◐ Dim';
 S.settings.theme=t;garden();dbSet('jp_settings',1,{theme:t})};
document.querySelectorAll('#modeSw button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.showAll=false;render()});
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
function step(n){
 if(S.mode==='money'||S.view==='month')S.cursor.setMonth(S.cursor.getMonth()+n);
 else if(S.view==='week')S.cursor.setDate(S.cursor.getDate()+7*n);
 else{S.sel.setDate(S.sel.getDate()+n);S.cursor=new Date(S.sel)}
 render();
}
(async function boot(){
 garden();
 document.getElementById('quote').textContent=QUOTES[new Date().getDate()%QUOTES.length];
 const [ev,td,fl,bl,ac,st,nt,ap,inc,al]=await Promise.all([
  dbAll('jp_events'),dbAll('jp_todos'),dbAll('jp_flows'),dbAll('jp_bills'),
  dbAll('jp_accounts?order=sort'),dbAll('jp_settings'),dbAll('jp_notes'),dbAll('jp_appts'),dbAll('jp_income?order=sort'),dbAll('jp_alloc')]);
 const loadFailed=(ev===null||bl===null||ap===null||ac===null);
 S.events=ev||[];S.todos=td||[];S.flows=fl||[];S.bills=bl||[];S.accounts=ac||[];S.appts=ap||[];S.income=inc||[];S.alloc=al||[];
 S.settings=(st&&st[0])||{};(nt||[]).forEach(n=>S.notes[n.date]=n.body);
 if(S.settings.theme==='dim'){document.documentElement.dataset.theme='dim';document.getElementById('themeBtn').textContent='◐ Dim'}
 PAY=payset();
 if(loadFailed){
  const b=document.createElement('div');b.className='offline';
  b.innerHTML='Could not load everything \u2014 your data is safe. <button id="rl">Reload</button>';
  document.querySelector('.app').prepend(b);
  document.getElementById('rl').onclick=()=>location.reload();
 }
 /* seed only on a confirmed-empty database */
 if(bl&&bl.length===0)await seedBills();
 if(ap&&ap.length===0)await seedAppts();
 if(inc&&inc.length===0)await seedIncome();
 await syncIncome();
 if(S.settings.paycheck)await syncPaychecks();
 if(window.innerWidth<820)S.view='day';
 render();
 const hr=new Date().getHours();
 if(!S.settings.paycheck&&!S.bills.length)setTimeout(openSetup,600);
 else if(hr<12&&!seen('jp_brief'))setTimeout(morningBrief,700);
 else if(hr>=19&&!seen('jp_evening'))setTimeout(eveningCheckin,700);
})();
</script>
</body>
