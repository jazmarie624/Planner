<!DOCTYPE html>
<html lang="en" data-theme="light" data-mode="life">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J Empire — The Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
[data-theme="light"]{
 --bg:#EFEAF4;--card:#FFF;--card2:#F8F5FB;
 --ink:#1C1622;--ink2:#3B3247;--muted:#655B71;--faint:#9C92A7;
 --line:#DBD2E5;--line2:#EAE4F0;
 --gold:#9C7A16;--gold-2:#7A5E10;--gold-soft:#F5EBD2;--gold-line:#D4BC7C;--ongold:#241C08;
 --appt-b:#E8D5D8;--appt-s:#8B4A56;
 --school-b:#D2D9E4;--school-s:#3E5480;
 --sports-b:#D5DDCE;--sports-s:#4E5C42;
 --personal-b:#E2D1DB;--personal-s:#74536A;
 --work-b:#DACFE7;--work-s:#5C4880;
 --gigs-b:#F0DCC8;--gigs-s:#9A5A22;
 --in-b:#D8EADE;--in-s:#22694A;--out-b:#F6DCDF;--out-s:#963648;
 --hi-b:#F7DDE1;--hi-s:#8E2B3E;--sm-b:#DDE4F2;--sm-s:#3B5488;--var-b:#EDE6F5;--var-s:#5C4880;
 --flower:#E1D6EC;--leaf:#D6DCD0;--gleaf:#EBDEBE;--fcore:#F8F4FB;--gop:.38;
}
[data-theme="dim"]{
 --bg:#CFC7DC;--card:#E4DDEC;--card2:#DAD2E6;
 --ink:#231C2E;--ink2:#3E3550;--muted:#5F5570;--faint:#8B819C;
 --line:#B9AECB;--line2:#C6BCD5;
 --gold:#8A6A12;--gold-2:#6E540C;--gold-soft:#E4D6B2;--gold-line:#B79E62;--ongold:#221A06;
 --appt-b:#DCC3C8;--appt-s:#7A3B47;
 --school-b:#C2CCDC;--school-s:#31456E;
 --sports-b:#C7D3BE;--sports-s:#3F4D34;
 --personal-b:#D6C1CE;--personal-s:#63435A;
 --work-b:#CBBEDD;--work-s:#4C3A70;
 --gigs-b:#E4CBB4;--gigs-s:#864A18;
 --in-b:#C3DBCB;--in-s:#1A5A3D;--out-b:#E9CBD0;--out-s:#822B3B;
 --hi-b:#E9C9CF;--hi-s:#7C2334;--sm-b:#C7D2E5;--sm-s:#2E4472;--var-b:#D4CADF;--var-s:#4C3A70;
 --flower:#C2B4D4;--leaf:#B9C3B2;--gleaf:#D3C4A4;--fcore:#E8E2F0;--gop:.48;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#g{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}#g svg{position:absolute}
.app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:10px 14px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.hide{display:none!important}
.sec{display:flex;align-items:center;gap:10px;margin:0 0 9px;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-line),transparent)}
.box{width:18px;height:18px;border-radius:6px;border:2px solid var(--faint);background:var(--card);flex:0 0 auto;cursor:pointer}
.box.on{background:var(--gold);border-color:var(--gold);position:relative}
.box.on::after{content:"✓";position:absolute;inset:0;color:var(--ongold);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}

.bar{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.wm{font-family:'Pinyon Script',cursive;font-size:25px;color:var(--gold-2);flex:1;line-height:1.1}
.wm small{display:block;font-family:inherit;font-size:11px;font-style:italic;font-weight:600;color:var(--ink2)}
.ib{height:36px;padding:0 13px;border-radius:100px;background:var(--card);border:1.5px solid var(--line);cursor:pointer;font-size:12px;font-weight:700;color:var(--ink2);font-family:inherit;white-space:nowrap}
.mode,.tabs{display:grid;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:5px;margin-bottom:8px}
.mode{grid-template-columns:1fr 1fr}.tabs{grid-template-columns:repeat(3,1fr)}
.mode button,.tabs button{position:relative;border:0;background:transparent;border-radius:9px;padding:10px;font-family:inherit;font-size:13.5px;font-weight:800;color:var(--muted);cursor:pointer}
.mode button.on,.tabs button.on{background:var(--gold);color:var(--ongold)}
.badge{position:absolute;top:2px;right:6px;background:var(--hi-s);color:#fff;font-size:9px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* assistant */
.asstOK{display:flex;align-items:center;gap:10px;border-radius:13px;padding:10px 14px;margin-bottom:9px;border:1.5px solid var(--in-s);background:var(--in-b);font-size:12.5px;font-weight:800;color:var(--in-s)}
.asstC{overflow:hidden;margin-bottom:9px}
.ch2{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--card2);border-bottom:1px solid var(--line2);font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.ch2 b{margin-left:auto;font-size:11.5px;color:var(--hi-s)}
.cr{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line2)}
.cr:last-child{border-bottom:0}
.cr .sq{width:8px;height:8px;border-radius:3px;flex:0 0 auto;background:var(--sc)}
.cr .t{font-size:12.5px;font-weight:700;line-height:1.3}
.cr .v{margin-left:auto;font-size:12px;font-weight:800;color:var(--sc);flex:0 0 auto}
.moreb{width:100%;border:0;background:var(--card2);padding:9px;font-family:inherit;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;border-top:1px solid var(--line2)}

/* kid filter */
.kids{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;scrollbar-width:none}
.kids::-webkit-scrollbar{display:none}
.kids button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:100px;padding:7px 14px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.kids button.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold-2)}

.mhead{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 9px}
.mhead h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.035em;text-align:center}
.mhead .yr{font-size:9.5px;font-weight:800;letter-spacing:.15em;color:var(--muted);text-align:center;margin-top:1px}
.nav{border:1.5px solid var(--line);background:var(--card);border-radius:100px;width:34px;height:34px;font-size:16px;font-weight:700;color:var(--ink2);cursor:pointer;flex:0 0 auto}

.accs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:9px}
.acc{border-radius:12px;padding:8px 9px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.acc .nm{font-size:8.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.acc b{display:block;font-size:16px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.acc.sep{background:var(--sm-b);border-color:var(--sm-s)}.acc.sep b{color:var(--sm-s)}
.acc.short{border-color:var(--hi-s);background:var(--hi-b)}.acc.short b{color:var(--hi-s)}
.acc .flag{font-size:7.5px;font-weight:800;color:var(--hi-s);display:block;margin-top:2px}

.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.n{border-radius:13px;padding:9px 8px;text-align:center;border:1.5px solid var(--line);background:var(--card)}
.n span{display:block;font-size:8.5px;font-weight:800;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.n b{font-size:17px;font-weight:800;letter-spacing:-.03em}
.n.in{background:var(--in-b);border-color:var(--in-s)}.n.in b{color:var(--in-s)}
.n.out{background:var(--out-b);border-color:var(--out-s)}.n.out b{color:var(--out-s)}
.n.var{background:var(--var-b);border-color:var(--var-s)}.n.var b{color:var(--var-s)}
.n.end{background:var(--gold-soft);border-color:var(--gold-line)}.n.end b{color:var(--gold-2)}
.n.end.bad{background:var(--hi-b);border-color:var(--hi-s)}.n.end.bad b{color:var(--hi-s)}

.grid2{display:grid;gap:13px}
.dows{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:2px solid var(--gold-line)}
.dows div{font-size:9px;font-weight:800;letter-spacing:.09em;color:var(--muted);padding:0 0 5px 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(0,1fr)}
.c{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:4px;overflow:hidden;cursor:pointer}
.c:nth-child(7n){border-right:0}.c.dim{opacity:.22}
.c .d{font-size:13.5px;font-weight:700}
.c.today .d{background:var(--gold);color:var(--ongold);width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.c.sel{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--gold-line)}
.c .hol{font-size:8.5px;font-weight:600;color:var(--muted);line-height:1.15;margin:1px 0}
.chip{position:relative;border-radius:6px;padding:2px 4px 2px 7px;margin-top:2px;overflow:hidden;background:var(--eb);color:var(--ink);font-size:9.5px;font-weight:700;white-space:nowrap;text-overflow:ellipsis}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--es)}
.chip.allday{border-radius:4px;font-weight:800;text-align:center;padding-left:4px}
.chip.allday::before{display:none}
.amt{border-radius:5px;padding:1px 5px;margin-top:3px;font-size:9.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt.i{background:var(--in-b);color:var(--in-s)}
.amt.o{background:var(--out-b);color:var(--out-s)}
.amt.o.pd{opacity:.42;text-decoration:line-through}
.amt.ghost{background:transparent;border:1.5px dashed var(--hi-s);color:var(--hi-s)}
.pay{font-size:8.5px;font-weight:800;color:var(--in-s);margin-top:2px}

.dp{padding:13px 14px}
.dp h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em}
.dp .bal{font-size:9.5px;font-weight:800;letter-spacing:.09em;color:var(--muted);margin:3px 0 10px}
.dpr{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px;font-weight:700;cursor:pointer}
.dpr:last-child{border-bottom:0}
.dpr .v{margin-left:auto;font-weight:800}
.dpr .v.i{color:var(--in-s)}.dpr .v.o{color:var(--out-s)}
.dpr .sub{font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
.empty{font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 0}

.board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:13px}
.wcol{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-height:180px;display:flex;flex-direction:column}
.wcol.today{border:2px solid var(--gold)}
.wcol.wknd{background:var(--card2)}
.wch{padding:7px 4px 6px;text-align:center;border-bottom:1px solid var(--line2);background:var(--card2)}
.wcol.today .wch{background:var(--gold)}
.wch .dl{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.wch .dn{font-size:18px;font-weight:800}
.wcol.today .wch .dl,.wcol.today .wch .dn{color:var(--ongold)}
.wcb{padding:5px;display:flex;flex-direction:column;gap:4px;flex:1}
.wev{position:relative;border-radius:8px;padding:5px 5px 5px 9px;overflow:hidden;background:var(--eb);border:1px solid var(--line2);cursor:pointer}
.wev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--es)}
.wev .tm{font-size:8.5px;font-weight:800;color:var(--es)}
.wev .nm{font-size:11px;font-weight:700;line-height:1.2;color:var(--ink)}
.wcb .none{font-size:11px;font-weight:700;color:var(--faint);text-align:center;padding:10px 0}
.wcb .holn{font-size:9px;font-weight:600;color:var(--muted);text-align:center}

.grph{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--card2);border-bottom:1px solid var(--line2);font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.grph b{margin-left:auto;font-size:11px;color:var(--ink2)}
.grp ul{margin:0;padding:0}
.grp li{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2)}
.grp li:last-child{border-bottom:0}
.grp .t{font-size:13.5px;font-weight:700;line-height:1.25}
.grp .w{font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
.cd{margin-left:auto;font-size:11px;font-weight:800;color:var(--muted)}
.cd.late{color:var(--hi-s)}

.tlwrap{overflow-x:auto}.tlgrid{min-width:max-content}
.tlhead{display:grid;grid-template-columns:58px repeat(6,minmax(126px,1fr));border-bottom:1.5px solid var(--line)}
.tlhead div{padding:9px 6px;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--ink2)}
.tlhead div+div{border-left:1px solid var(--line2)}
.tlhead .dot{display:block;width:8px;height:8px;border-radius:50%;margin:0 auto 4px}
.tlbody{display:grid;grid-template-columns:58px repeat(6,minmax(126px,1fr));position:relative}
.hcol{border-right:1px solid var(--line2);position:relative}.hcol:last-child{border-right:0}
.hr,.hlab{height:46px;border-bottom:1px solid var(--line2)}
.hlab{font-size:10px;font-weight:700;color:var(--muted);padding:3px 7px 0;text-align:right}
.nowline{position:absolute;left:58px;right:0;border-top:2px solid var(--gold);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:3px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.slot{position:absolute;left:3px;right:3px;border-radius:9px;padding:5px 7px;overflow:hidden;background:var(--eb);border:1px solid var(--line2);cursor:pointer}
.slot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--es)}
.slot .t{font-size:8.5px;font-weight:800;color:var(--es)}
.slot .n{font-size:12.5px;font-weight:700;color:var(--ink)}
.adband{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.adband .u{position:relative;background:var(--eb);border:1px solid var(--line2);border-radius:9px;padding:6px 11px 6px 12px;font-size:12px;font-weight:700;overflow:hidden;color:var(--ink);cursor:pointer}
.adband .u::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--es)}
.note-in{width:100%;min-height:62px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:11px 13px;font-family:inherit;font-size:13px;resize:vertical;color:var(--ink)}

.rail{display:grid;gap:11px}
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:7px;border-bottom:1px solid var(--line2)}
.tabbar button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 3px;font-family:inherit;font-size:10px;font-weight:800;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .ct{font-size:15px;font-weight:800}
.tabbar button.on{background:var(--c);border-color:var(--c);color:#fff}
.tabbody{padding:4px 14px 12px}
.tabbody ul{margin:0;padding:0}
.tabbody li{list-style:none;display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line2)}
.tabbody li:last-of-type{border-bottom:0}
.tabbody .n2{font-size:13px;font-weight:650;line-height:1.25;flex:1}
.tabbody .x{color:var(--faint);font-size:15px;font-weight:700;cursor:pointer}

.refhead{display:flex;align-items:baseline;gap:9px;padding:11px 14px 7px}
.refhead h3{margin:0;font-size:14px;font-weight:800;letter-spacing:-.02em}
.refhead .c2{margin-left:auto;font-size:11px;font-weight:800;color:var(--muted)}
.refhint{font-size:10.5px;font-weight:600;color:var(--muted);padding:0 14px 8px}
.ref{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 11px}
.rp{display:flex;align-items:center;gap:6px;border-radius:100px;padding:6px 10px 6px 8px;border:1.5px solid var(--line);background:var(--card2);font-size:11.5px;font-weight:700;cursor:pointer}
.rp .tick{width:14px;height:14px;border-radius:50%;border:2px solid var(--faint);flex:0 0 auto;position:relative}
.rp.on{background:var(--in-b);border-color:var(--in-s);color:var(--in-s)}
.rp.on .tick{background:var(--in-s);border-color:var(--in-s)}
.rp.on .tick::after{content:"✓";position:absolute;inset:0;color:var(--card);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.rp.off{background:var(--hi-b);border-color:var(--hi-s);color:var(--hi-s)}
.rp .am{font-weight:800;opacity:.72}
.rp.plus{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold-2);font-weight:800}
.refbar{display:flex;align-items:center;gap:9px;padding:10px 14px;border-top:1px solid var(--line2);background:var(--card2);font-size:11.5px;font-weight:700;color:var(--ink2)}
.refbar button{margin-left:auto;border:0;background:var(--gold);color:var(--ongold);border-radius:9px;padding:7px 13px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer}

.roll{border:1.5px solid var(--hi-s);background:var(--hi-b);border-radius:15px;overflow:hidden;margin-bottom:10px}
.rollh{display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--hi-s)}
.rollh b{margin-left:auto;font-size:13px}
.rh{display:flex;align-items:center;gap:9px;padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--line2);font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.rh b{margin-left:auto;font-size:12px;color:var(--ink)}
.r{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line2);cursor:pointer;background:var(--card)}
.r:last-of-type{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--dc)}
.r .nm{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.r .sub{font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
.r .val{margin-left:auto;text-align:right}
.r .val b{font-size:14px;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.05em;border-radius:5px;padding:2px 6px;border:1.5px solid;margin-top:3px}
.pill.ok{color:var(--in-s);border-color:var(--in-s);background:var(--in-b)}
.pill.due{color:var(--gold-2);border-color:var(--gold-line);background:var(--gold-soft)}
.pill.late{color:var(--out-s);border-color:var(--out-s);background:var(--out-b)}
.pill.miss{color:var(--hi-s);border-color:var(--hi-s);background:var(--hi-b)}
.setrow{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:9px}
.setrow .lb{font-size:12.5px;font-weight:700;line-height:1.3}
.setrow .sub{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px}
.setrow input{width:96px;margin-left:auto;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:15px;font-weight:800;text-align:right;background:var(--card);color:var(--ink)}
.addrow{display:block;width:100%;margin-top:9px;border:1.5px dashed var(--faint);background:var(--card);border-radius:12px;padding:11px;font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--muted);cursor:pointer}

.fab{position:fixed;right:18px;bottom:20px;z-index:30;width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:var(--ongold);font-size:30px;font-weight:300;cursor:pointer;box-shadow:0 6px 20px rgba(60,40,80,.32)}
.scrim{position:fixed;inset:0;background:rgba(28,22,34,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}

 mode:'life',view:'month',mtab:'m',cursor:new Date(),sel:new Date(),tab:'To-Do',kid:'',showAll:false};

const key=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};

 [lastDow(y,4,1),"Memorial Day"],[obs(y,5,19),"Juneteenth"],[obs(y,6,4),"Independence Day"],
 [nthDow(y,8,1,1),"Labor Day"],[nthDow(y,9,1,2),"Columbus Day"],[obs(y,10,11),"Veterans Day"],
 [nthDow(y,10,4,4),"Thanksgiving"],[obs(y,11,25),"Christmas"]].reduce((m,[d,n])=>(m[key(d)]=n,m),{});

 const P=new Set(),anchor=parse(S.settings.pay_anchor||'2026-08-21');
 let b=new Date(anchor);while(b>new Date(TODAY.getFullYear()-1,0,1)){P.add(key(b));b.setDate(b.getDate()-14)}

 const lf=`<path fill="var(--fl)" d="M50 6 C86 30 86 72 50 96 C14 72 14 30 50 6 Z"/><path stroke="var(--fc)" stroke-width="3" fill="none" d="M50 12 L50 92"/>`;
 const it=[[3,2,132,-12,'f','flower'],[66,1,102,20,'f','gleaf'],[89,8,74,-30,'v','leaf'],[-2,14,142,8,'f','flower'],

 document.getElementById('g').innerHTML=it.map(([x,y,s,r,t,c])=>
  `<svg viewBox="0 0 100 100" width="${s}" height="${s}" style="left:${x}%;top:${y}%;transform:rotate(${r}deg);opacity:var(--gop);--fl:var(--${c});--fc:var(--fcore)">${t==='f'?fl:lf}</svg>`).join('');
}

/* ================= DERIVED ================= */
const kidOK=e=>!S.kid||e.who===S.kid;
function evOn(d){
 const k=key(d);
 return S.events.filter(e=>kidOK(e)&&(e.date===k||(e.end_date&&e.date<=k&&k<=e.end_date)))
  .sort((a,b)=>((a.all_day?'0':a.time||'zz')).localeCompare(b.all_day?'0':b.time||'zz'));
}
const flowsOn=d=>S.flows.filter(f=>f.date===key(d));
const openOut=()=>S.flows.filter(f=>f.kind==='out'&&!f.done);
const isGig=f=>GIG.includes(f.source);
/* projected income excludes unreceived gig money */
const countsIn=f=>f.kind==='in'&&(f.done||!isGig(f));

function monthTotals(){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 const inM=f=>{const d=parse(f.date);return d.getFullYear()===y&&d.getMonth()===m};
 const fl=S.flows.filter(inM);
 const i=fl.filter(countsIn).reduce((s,x)=>s+(+x.amount||0),0);
 const o=fl.filter(x=>x.kind==='out').reduce((s,x)=>s+(+x.amount||0),0);
 const weeks=new Date(y,m+1,0).getDate()/7;
 const spend=(+S.settings.weekly_spend||0)*weeks;
 const start=S.accounts.filter(a=>!a.separate).reduce((s,a)=>s+(+a.balance||0),0);
 return{i,o,spend,start,end:start+i-o-spend};
}
function beforeNextPay(){
 const p=nextPay(TODAY);if(!p)return{amt:0,when:'—',list:[]};
 const list=openOut().filter(f=>parse(f.date)>=TODAY&&parse(f.date)<=p);
 return{amt:list.reduce((s,x)=>s+(+x.amount||0),0),when:p.toLocaleDateString(undefined,{month:'short',day:'numeric'}),list};
}
function runBal(y,m){
 const map={};let b=S.accounts.filter(a=>!a.separate).reduce((s,a)=>s+(+a.balance||0),0);
 const days=new Date(y,m+1,0).getDate();
 for(let d=1;d<=days;d++){const k=key(new Date(y,m,d));
  S.flows.filter(f=>f.date===k).forEach(f=>{if(f.kind==='out')b-=+f.amount||0;else if(countsIn(f))b+=+f.amount||0});
  map[k]=b}
 return map;
}
const billOn=b=>{const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 return S.flows.find(f=>f.bill_id===b.id&&parse(f.date).getFullYear()===y&&parse(f.date).getMonth()===m)};
function accShort(){
 const out=[];
 S.accounts.filter(a=>!a.separate).forEach(a=>{
  const due=openOut().filter(f=>f.account===a.name&&parse(f.date)>=TODAY&&parse(f.date)<=(nextPay(TODAY)||TODAY))
   .reduce((s,f)=>s+(+f.amount||0),0);
  if(due>(+a.balance||0))out.push({name:a.name,due,have:+a.balance||0});
 });
 return out;
}

/* ================= ASSISTANT ================= */
function alertsMoney(){
 const A=[];
 const od=openOut().filter(f=>dd(parse(f.date))<0);
 if(od.length)A.push({sc:'var(--hi-s)',t:od.length===1?od[0].title+' is '+Math.abs(dd(parse(od[0].date)))+' days late':od.length+' bills overdue',v:money(od.reduce((s,x)=>s+(+x.amount||0),0))});
 const miss=S.bills.filter(b=>b.active&&!billOn(b));
 if(miss.length)A.push({sc:'var(--gold-2)',t:miss.length+' bill'+(miss.length>1?'s':'')+" not on this month",v:money(miss.reduce((s,b)=>s+(+b.amount||0),0))});
 const{end}=monthTotals(),cush=+S.settings.cushion||0;
 if(S.flows.length&&end<cush)A.push({sc:'var(--hi-s)',t:end<0?'This month ends below zero':'Ends under your '+money(cush)+' cushion',v:money(end)});
 const rb=runBal(S.cursor.getFullYear(),S.cursor.getMonth());
 const dip=Object.entries(rb).find(([k,v])=>v<0&&parse(k)>=TODAY);
 if(dip)A.push({sc:'var(--hi-s)',t:'Goes negative '+parse(dip[0]).toLocaleDateString(undefined,{month:'short',day:'numeric'}),v:money(dip[1])});
 accShort().forEach(a=>A.push({sc:'var(--hi-s)',t:a.name+' is short before payday',v:money(a.due-a.have)}));
 const noAmt=S.flows.filter(f=>!+f.amount);
 if(noAmt.length)A.push({sc:'var(--gold-2)',t:noAmt.length+' entr'+(noAmt.length>1?'ies have':'y has')+' no amount',v:'—'});
 return A;
}
function alertsLife(){
 const A=[];
 const up=S.events.filter(e=>parse(e.date)>=TODAY);
 const byD={};up.filter(e=>e.time).forEach(e=>(byD[e.date]=byD[e.date]||[]).push(e));
 const dbl=[];Object.entries(byD).forEach(([d,l])=>{l.sort((a,b)=>a.time.localeCompare(b.time));
  for(let i=1;i<l.length;i++)if(l[i].time===l[i-1].time)dbl.push(parse(d).toLocaleDateString(undefined,{month:'short',day:'numeric'}))});
 if(dbl.length)A.push({sc:'var(--hi-s)',t:'Double-booked '+[...new Set(dbl)].join(', '),v:''});
 const seen=new Set();
 up.forEach(e=>{if(seen.has(e.date))return;const n=S.events.filter(x=>x.date===e.date).length;
  if(n>=HEAVY){seen.add(e.date);A.push({sc:'var(--gold-2)',t:parse(e.date).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+' is loaded',v:n+' things'})}});
 const nt=up.filter(e=>!e.time&&!e.all_day);
 if(nt.length)A.push({sc:'var(--gold-2)',t:nt.length+' upcoming event'+(nt.length>1?'s have':' has')+' no time',v:''});
 return A;
}
function renderAssist(){

  ${show.map(a=>`<div class="cr"><span class="sq" style="--sc:${a.sc}"></span><span class="t">${a.t}</span><span class="v" style="--sc:${a.sc}">${a.v}</span></div>`).join('')}

/* ================= RENDER ================= */
function render(){
 document.querySelectorAll('#modeSw button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
 document.getElementById('tabSw').innerHTML=(S.mode==='life'
  ?[['month','Month'],['week','Week'],['day','Day']].map(([v,l])=>`<button data-v="${v}" class="${S.view===v?'on':''}">${l}</button>`)
  :[['m','Month'],['i','In'],['o','Out']].map(([v,l])=>`<button data-t="${v}" class="${S.mtab===v?'on':''}">${l}</button>`)).join('');
 document.querySelectorAll('#tabSw [data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});
 document.querySelectorAll('#tabSw [data-t]').forEach(b=>b.onclick=()=>{S.mtab=b.dataset.t;render()});
 document.getElementById('kidBar').classList.toggle('hide',S.mode!=='life');
 document.getElementById('accs').classList.toggle('hide',S.mode!=='money');
 document.getElementById('kidBar').innerHTML=['All',...WHO].map(k=>
  `<button data-k="${k==='All'?'':k}" class="${S.kid===(k==='All'?'':k)?'on':''}">${k}</button>`).join('');
 document.querySelectorAll('#kidBar button').forEach(b=>b.onclick=()=>{S.kid=b.dataset.k;render()});
 if(S.mode==='money')renderAccs();
 renderAssist();renderHead();
 const st=document.getElementById('stage');
 st.innerHTML = S.mode==='life'
  ? (S.view==='month'?lifeMonth():S.view==='week'?lifeWeek():lifeDay())
  : (S.mtab==='m'?moneyMonth():S.mtab==='i'?moneyIn():moneyOut());
 bindStage();
}
function renderHead(){
 const h=document.getElementById('hTitle'),s=document.getElementById('hSub');
 if(S.mode==='money'||S.view==='month'){h.textContent=S.cursor.toLocaleDateString(undefined,{month:'long'});s.textContent=S.cursor.getFullYear()}
 else if(S.view==='week'){const a=new Date(S.cursor);a.setDate(a.getDate()-a.getDay());const b=new Date(a);b.setDate(b.getDate()+6);
  h.textContent='Week of '+a.toLocaleDateString(undefined,{month:'long',day:'numeric'});
  s.textContent=(a.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+b.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})).toUpperCase()}
 else{const k=key(S.sel);
  h.textContent=same(S.sel,TODAY)?'Today':S.sel.toLocaleDateString(undefined,{weekday:'long'});
  s.textContent=S.sel.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase()+(HOL[k]?' · '+HOL[k].toUpperCase():'')+(PAY.has(k)?' · PAYDAY':'')}
}
function renderAccs(){
 document.getElementById('accs').innerHTML=S.accounts.map(a=>{
  const sh=accShort().find(x=>x.name===a.name);
  return `<div class="acc ${a.separate?'sep':''} ${sh?'short':''}" data-acc="${a.id}">
   <span class="nm">${a.name.toUpperCase()}</span><b>${money(a.balance)}</b>
   ${sh?`<span class="flag">${money(sh.due)} DUE</span>`:''}</div>`}).join('');
 document.querySelectorAll('[data-acc]').forEach(el=>el.onclick=()=>{
  const a=S.accounts.find(x=>x.id==el.dataset.acc);
  const v=prompt('Balance in '+a.name,a.balance);if(v===null)return;
  a.balance=+v||0;dbSet('jp_accounts',a.id,{balance:a.balance,updated_at:new Date().toISOString()});render()});
}

/* ---- LIFE ---- */
function calCells(build){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 let h='';for(let i=0;i<first;i++)h+='<div class="c dim"></div>';
 for(let d=1;d<=days;d++)h+=build(new Date(y,m,d),d);
 const rows=Math.ceil((first+days)/7);
 for(let i=first+days;i<rows*7;i++)h+='<div class="c dim"></div>';
 return h;
}
function lifeMonth(){
 const cells=calCells((dt,d)=>{
  const k=key(dt),ev=evOn(dt),ho=HOL[k],pay=PAY.has(k);
  const chips=ev.slice(0,2).map(e=>`<div class="chip ${e.all_day?'allday':''}" style="--eb:var(--${CATS[e.cat]}-b);--es:var(--${CATS[e.cat]}-s)">${e.title}</div>`).join('')
   +(ev.length>2?`<div class="chip" style="--eb:transparent;--es:transparent;color:var(--muted)">+${ev.length-2}</div>`:'');
  const dots=`<div class="dots">${pay?'<i style="--es:var(--in-s)"></i>':''}${ev.slice(0,3).map(e=>`<i style="--es:var(--${CATS[e.cat]}-s)"></i>`).join('')}</div>`;
  return `<div class="c${same(dt,TODAY)?' today':''}${same(dt,S.sel)?' sel':''}" data-d="${k}"><div class="d">${d}</div>
   ${ho?`<div class="hol">(${ho})</div>`:''}${pay?'<div class="pay">PAYDAY</div>':''}${chips}${dots}</div>`;
 });
 const ev=evOn(S.sel),k=key(S.sel);
 return `<div class="grid2"><div>
  <div class="dows"><div>SU</div><div>MO</div><div>TU</div><div>WE</div><div>TH</div><div>FR</div><div>SA</div></div>
  <div class="cal">${cells}</div></div>
  <div><div class="card dp" style="margin-bottom:11px">
   <h3>${S.sel.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h3>
   <div class="bal">${ev.length} EVENT${ev.length===1?'':'S'}${HOL[k]?' · '+HOL[k].toUpperCase():''}${PAY.has(k)?' · PAYDAY':''}</div>
   ${ev.length?ev.map(e=>evRow(e)).join(''):'<div class="empty">Nothing on this day.</div>'}</div>
   ${railHTML()}</div></div>`;
}
const evRow=e=>`<div class="dpr" data-ev="${e.id}"><div><div>${e.title}</div>
 <div class="sub">${e.cat}${e.all_day?' · all day':(e.time?' · '+fmt(e.time):'')}${e.who?' · '+e.who:''}${e.location?' · '+e.location:''}</div></div></div>`;
function lifeWeek(){
 const a=new Date(S.cursor);a.setDate(a.getDate()-a.getDay());
 let cols='';
 for(let i=0;i<7;i++){
  const d=new Date(a);d.setDate(d.getDate()+i);
  const ev=evOn(d),k=key(d),ho=HOL[k],pay=PAY.has(k);
  const body=(ho?`<div class="holn">(${ho})</div>`:'')+(pay?`<div class="wev" style="--eb:var(--in-b);--es:var(--in-s)"><div class="tm">INCOME</div><div class="nm">Payday</div></div>`:'')
   +ev.map(e=>`<div class="wev" data-ev="${e.id}" style="--eb:var(--${CATS[e.cat]}-b);--es:var(--${CATS[e.cat]}-s)">
     <div class="tm">${e.all_day?'ALL DAY':(e.time?fmt(e.time):e.cat.toUpperCase())}${e.who?' · '+e.who:''}</div>
     <div class="nm">${e.title}</div></div>`).join('')||'<div class="none">—</div>';
  cols+=`<div class="wcol ${same(d,TODAY)?'today':''} ${[0,6].includes(d.getDay())?'wknd':''}">
   <div class="wch"><div class="dl">${d.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase()}</div><div class="dn">${d.getDate()}</div></div>
   <div class="wcb">${body}</div></div>`;
 }
 const items=[];
 S.events.filter(kidOK).forEach(e=>{const n=dd(parse(e.date));if(n<-30)return;
  items.push({t:e.title,w:e.cat+(e.time?' · '+fmt(e.time):'')+(e.who?' · '+e.who:''),d:n,id:e.id})});
 S.todos.filter(t=>!t.done).forEach(t=>items.push({t:t.title,w:t.list,d:null}));
 const G=[['OVERDUE',x=>x.d!==null&&x.d<0],['TODAY',x=>x.d===0],['TOMORROW',x=>x.d===1],['THIS WEEK',x=>x.d>1&&x.d<=7],['LATER',x=>x.d>7],['NO DATE',x=>x.d===null]];
 const cdT=n=>n===null?'no date':n<0?Math.abs(n)+'d ago':n===0?'today':n===1?'tomorrow':'in '+n+' days';
 let list='';
 G.forEach(([nm,f])=>{const l=items.filter(f);if(!l.length)return;
  l.sort((x,y)=>(x.d==null?999:x.d)-(y.d==null?999:y.d));
  list+=`<div class="grph">${nm}<b>${l.length}</b></div><ul>`+l.map(x=>
   `<li${x.id?` data-ev="${x.id}"`:''}><span class="box"></span><div><div class="t">${x.t}</div><div class="w">${x.w}</div></div><span class="cd ${x.d!==null&&x.d<0?'late':''}">${cdT(x.d)}</span></li>`).join('')+'</ul>'});
 return `<div class="grid2"><div><div class="board">${cols}</div>
  <div class="sec">WHAT'S COMING</div><div class="card grp">${list||'<div class="empty" style="padding:20px 14px;text-align:center">Nothing yet.</div>'}</div></div>
  <div>${railHTML()}</div></div>`;
}
function lifeDay(){
 const d=S.sel,ev=evOn(d);
 const ad=ev.filter(e=>e.all_day||!e.time);
 const H=[];for(let i=6;i<=21;i++)H.push(i);
 let body=`<div class="hcol">${H.map(h=>`<div class="hlab">${fmt(h+':00')}</div>`).join('')}</div>`;
 CATLIST.forEach(c=>{
  const rows=H.map(()=>'<div class="hr"></div>').join('');
  const slots=ev.filter(e=>e.cat===c&&e.time&&!e.all_day).map(e=>{const[hh,mm]=e.time.split(':').map(Number);
   return `<div class="slot" data-ev="${e.id}" style="top:${((hh+mm/60)-6)*46+1}px;height:44px;--eb:var(--${CATS[c]}-b);--es:var(--${CATS[c]}-s)">
    <div class="t">${fmt(e.time)}${e.who?' · '+e.who:''}</div><div class="n">${e.title}</div></div>`}).join('');
  body+=`<div class="hcol">${rows}${slots}</div>`;
 });
 const nowT=new Date().getHours()+new Date().getMinutes()/60;
 if(same(d,TODAY)&&nowT>=6&&nowT<=21)body+=`<div class="nowline" style="top:${(nowT-6)*46}px"></div>`;
 const note=S.notes[key(d)]||'';
 return `<div class="grid2"><div>
  ${ad.length?`<div class="adband">${ad.map(e=>`<div class="u" data-ev="${e.id}" style="--eb:var(--${CATS[e.cat]}-b);--es:var(--${CATS[e.cat]}-s)">${e.title}${e.all_day?'':' · no time'}</div>`).join('')}</div>`:''}
  <div class="card tlwrap"><div class="tlgrid">
   <div class="tlhead"><div></div>${CATLIST.map(c=>`<div><span class="dot" style="background:var(--${CATS[c]}-s)"></span>${c.toUpperCase()}</div>`).join('')}</div>
   <div class="tlbody">${body}</div></div></div>
  <div class="sec" style="margin-top:14px">DAY NOTE</div>
  <textarea class="note-in" id="dayNote" placeholder="Quick note for today…">${note}</textarea></div>
  <div>${railHTML()}</div></div>`;
}
function railHTML(){
 const L=['To-Do','To Buy','To Call'],C={'To-Do':'#6E5A8A','To Buy':'#845F66','To Call':'#4E5C42'};
 return `<div class="rail"><div class="card">
  <div class="tabbar">${L.map(l=>`<button class="${S.tab===l?'on':''}" style="--c:${C[l]}" data-t2="${l}"><span class="ct">${S.todos.filter(t=>t.list===l&&!t.done).length}</span>${l.toUpperCase()}</button>`).join('')}</div>
  <div class="tabbody"><ul>${S.todos.filter(t=>t.list===S.tab).map(t=>
   `<li><span class="box ${t.done?'on':''}" data-td="${t.id}"></span><span class="n2" style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${t.title}</span><span class="x" data-rm="${t.id}">×</span></li>`).join('')
   ||'<li style="border:0;padding:12px 0"><span style="font-size:12.5px;color:var(--muted);font-weight:600">Nothing here yet.</span></li>'}</ul>
  <button class="addrow" data-addtd="${S.tab}">+ ADD TO ${S.tab.toUpperCase()}</button></div></div></div>`;
}

/* ---- MONEY ---- */
function refHTML(){
 const s=[...S.bills].filter(b=>b.active).sort((a,b)=>a.due_day-b.due_day);
 const miss=s.filter(b=>!billOn(b));
 return `<div class="card"><div class="refhead"><h3>My monthly bills</h3><span class="c2">${s.length-miss.length} of ${s.length} on ${S.cursor.toLocaleDateString(undefined,{month:'long'})}</span></div>
  <div class="refhint">Tap a bill to edit it, or + to add one.</div>
  <div class="ref">${s.map(b=>`<div class="rp ${billOn(b)?'on':'off'}" data-bill="${b.id}"><span class="tick"></span>${b.name} <span class="am">${money(b.amount)}</span></div>`).join('')}
   <div class="rp plus" id="addBill">+ Add a bill</div></div>
  ${miss.length?`<div class="refbar">${miss.length} missing · ${money(miss.reduce((t,b)=>t+(+b.amount||0),0))} not counted<button id="addAll">ADD ALL</button></div>`:''}</div>`;
}
function moneyMonth(){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth(),rb=runBal(y,m);
 const{i,o,spend,end}=monthTotals(),cush=+S.settings.cushion||0;
 const ghosts=S.bills.filter(b=>b.active&&!billOn(b));
 const cells=calCells((dt,d)=>{
  const k=key(dt),f=flowsOn(dt);
  const gh=ghosts.filter(b=>Math.min(b.due_day,new Date(y,m+1,0).getDate())===d);
  const chips=f.slice(0,2).map(x=>`<div class="amt ${x.kind==='in'?'i':'o'} ${x.done&&x.kind==='out'?'pd':''}">${x.kind==='in'?'+':'−'}${money(x.amount)}</div>`).join('')
   +gh.map(b=>`<div class="amt ghost">−${money(b.amount)}</div>`).join('')
   +(f.length>2?`<div class="amt" style="background:transparent;color:var(--muted)">+${f.length-2}</div>`:'');
  const dots=`<div class="dots">${f.slice(0,4).map(x=>`<i style="--es:var(--${x.kind}-s)"></i>`).join('')}</div>`;
  return `<div class="c${same(dt,TODAY)?' today':''}${same(dt,S.sel)?' sel':''}" data-d="${k}"><div class="d">${d}</div>${chips}${dots}</div>`;
 });
 const f=flowsOn(S.sel);
 return `<div class="strip">
  <div class="n in"><span>IN</span><b>${money(i)}</b></div>
  <div class="n out"><span>BILLS OUT</span><b>${money(o)}</b></div>
  <div class="n var"><span>SPENDING</span><b>${money(spend)}</b></div>
  <div class="n end ${end<cush?'bad':''}"><span>END OF MONTH</span><b>${money(end)}</b></div></div>
 <div class="grid2"><div>
  <div class="dows"><div>SU</div><div>MO</div><div>TU</div><div>WE</div><div>TH</div><div>FR</div><div>SA</div></div>
  <div class="cal">${cells}</div></div>
  <div><div class="card dp" style="margin-bottom:11px">
   <h3>${S.sel.toLocaleDateString(undefined,{month:'long',day:'numeric'})}</h3>
   <div class="bal">BALANCE AFTER THIS DAY · ${money(rb[key(S.sel)]||0)}</div>
   ${f.length?f.map(flowRow).join(''):'<div class="empty">No money moves this day.</div>'}</div>
   ${refHTML()}</div></div>`;
}
const flowRow=x=>`<div class="dpr" data-fl="${x.id}"><div><div>${x.title}</div>
 <div class="sub">${x.kind==='in'?(x.source||'Income'):(x.account||'Payment')}${x.done?(x.kind==='in'?' · received':' · paid'):''}</div></div>
 <span class="v ${x.kind==='in'?'i':'o'}">${x.kind==='in'?'+':'−'}${money2(x.amount)}</span></div>`;
function moneyIn(){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 const fl=S.flows.filter(f=>f.kind==='in'&&parse(f.date).getFullYear()===y&&parse(f.date).getMonth()===m).sort((a,b)=>a.date.localeCompare(b.date));
 const got=fl.filter(f=>f.done).reduce((s,f)=>s+(+f.amount||0),0);
 const com=fl.filter(f=>!f.done&&!isGig(f)).reduce((s,f)=>s+(+f.amount||0),0);
 return `<div class="strip" style="grid-template-columns:repeat(3,1fr)">
  <div class="n in"><span>RECEIVED</span><b>${money(got)}</b></div>
  <div class="n"><span>STILL COMING</span><b>${money(com)}</b></div>
  <div class="n end"><span>COUNTED</span><b>${money(got+com)}</b></div></div>
 <div class="card"><div class="rh">DEPOSITS<b>${money(fl.reduce((s,f)=>s+(+f.amount||0),0))}</b></div>
  ${fl.length?fl.map(f=>`<div class="r" data-fl="${f.id}"><span class="dot" style="--dc:${f.source&&f.source.startsWith('CS')?'var(--sm-s)':'var(--in-s)'}"></span>
   <div><div class="nm">${f.title}</div><div class="sub">${parse(f.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${f.source||''}</div></div>
   <div class="val"><b style="color:var(--in-s)">+${money2(f.amount)}</b><br>
   <span class="pill ${f.done?'ok':(isGig(f)?'miss':'due')}">${f.done?'RECEIVED':(isGig(f)?'NOT COUNTED':'EXPECTED')}</span></div></div>`).join('')
  :'<div class="empty" style="padding:20px 14px;text-align:center">No deposits yet.</div>'}</div>
 <button class="addrow" id="addIn">+ ADD INCOME</button>
 <div class="card setrow" style="margin-top:11px"><div><div class="lb">Gig money isn't projected</div>
  <div class="sub">DoorDash and serve fees only count once you mark them received.</div></div></div>
 <div class="card setrow"><div><div class="lb">Paycheck amount</div>
  <div class="sub">Used to auto-fill every other Friday.</div></div>
  <input id="setPay" type="number" inputmode="decimal" value="${S.settings.paycheck||''}"></div>`;
}
function moneyOut(){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth();
 const cur=S.flows.filter(f=>f.kind==='out'&&parse(f.date).getFullYear()===y&&parse(f.date).getMonth()===m).sort((a,b)=>a.date.localeCompare(b.date));
 const roll=S.flows.filter(f=>f.kind==='out'&&!f.done&&parse(f.date)<new Date(y,m,1));
 const unpaid=cur.filter(f=>!f.done).reduce((s,f)=>s+(+f.amount||0),0);
 const paid=cur.filter(f=>f.done).reduce((s,f)=>s+(+f.amount||0),0);
 const miss=S.bills.filter(b=>b.active&&!billOn(b));
 const L={paid:'PAID',late:'LATE',due:'SCHEDULED'};
 const row=f=>{const n=dd(parse(f.date));const st=f.done?'paid':n<0?'late':'due';
  return `<div class="r" data-fl="${f.id}"><span class="dot" style="--dc:var(--out-s)"></span>
   <div><div class="nm">${f.title}</div><div class="sub">${parse(f.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${f.account||''}</div></div>
   <div class="val"><b style="color:var(--out-s)">${money2(f.amount)}</b><br>
   <span class="pill ${st}">${st==='late'?Math.abs(n)+' DAYS LATE':L[st]}</span></div></div>`};
 return `${roll.length?`<div class="roll"><div class="rollh">CARRIED FROM EARLIER<b>${money(roll.reduce((s,f)=>s+(+f.amount||0),0))}</b></div>
   ${roll.map(row).join('')}</div>`:''}
  ${refHTML()}
  <div class="card setrow" style="margin-top:10px"><div><div class="lb">End the month with at least</div>
   <div class="sub">Turns the end number red when you're under.</div></div>
   <input id="setCush" type="number" inputmode="decimal" value="${S.settings.cushion||''}"></div>
  <div class="card setrow"><div><div class="lb">Typical spending per week</div>
   <div class="sub">Gas, groceries, school stuff. One number — not tracked here.</div></div>
   <input id="setSpend" type="number" inputmode="decimal" value="${S.settings.weekly_spend||''}"></div>
  <div class="strip" style="grid-template-columns:repeat(3,1fr)">
   <div class="n out"><span>UNPAID</span><b>${money(unpaid)}</b></div>
   <div class="n"><span>PAID</span><b>${money(paid)}</b></div>
   <div class="n end ${miss.length?'bad':''}"><span>NOT SCHEDULED</span><b>${money(miss.reduce((s,b)=>s+(+b.amount||0),0))}</b></div></div>
  <div class="card"><div class="rh">${S.cursor.toLocaleDateString(undefined,{month:'long'}).toUpperCase()} · BY DUE DATE<b>${money(unpaid+paid)}</b></div>
   ${cur.length?cur.map(row).join(''):'<div class="empty" style="padding:20px 14px;text-align:center">Nothing scheduled yet.</div>'}</div>
  <button class="addrow" id="addOut">+ ADD A PAYMENT</button>`;
}

/* ================= BINDINGS ================= */
function bindStage(){
 document.querySelectorAll('.c[data-d]').forEach(c=>c.onclick=()=>{S.sel=parse(c.dataset.d);render()});
 document.querySelectorAll('[data-ev]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();openEvent(S.events.find(x=>x.id==e.dataset.ev))});
 document.querySelectorAll('[data-fl]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();openFlow(S.flows.find(x=>x.id==e.dataset.fl))});
 document.querySelectorAll('[data-bill]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();openBill(S.bills.find(x=>x.id==e.dataset.bill))});
 document.querySelectorAll('[data-t2]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t2;render()});
 document.querySelectorAll('[data-td]').forEach(b=>b.onclick=async()=>{
  const t=S.todos.find(x=>x.id==b.dataset.td);t.done=!t.done;await dbSet('jp_todos',t.id,{done:t.done});render()});
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async e=>{e.stopPropagation();
  S.todos=S.todos.filter(x=>x.id!=b.dataset.rm);await dbDel('jp_todos',b.dataset.rm);render()});
 document.querySelectorAll('[data-addtd]').forEach(b=>b.onclick=()=>openTodo(b.dataset.addtd));
 const ab=document.getElementById('addBill');if(ab)ab.onclick=()=>openBill(null);
 const aa=document.getElementById('addAll');if(aa)aa.onclick=addAllMissing;
 const ai=document.getElementById('addIn');if(ai)ai.onclick=()=>openFlow(null,'in');
 const ao=document.getElementById('addOut');if(ao)ao.onclick=()=>openFlow(null,'out');
 const dn=document.getElementById('dayNote');
 if(dn)dn.onblur=async()=>{S.notes[key(S.sel)]=dn.value;await dbNote(key(S.sel),dn.value);toast('Note saved')};
 [['setPay','paycheck'],['setCush','cushion'],['setSpend','weekly_spend']].forEach(([id,f])=>{
  const el=document.getElementById(id);if(!el)return;
  el.onchange=async()=>{S.settings[f]=+el.value||0;await dbSet('jp_settings',1,{[f]:S.settings[f]});
   if(f==='paycheck')await syncPaychecks();render()}});
}
async function addAllMissing(){
 const y=S.cursor.getFullYear(),m=S.cursor.getMonth(),last=new Date(y,m+1,0).getDate();
 for(const b of S.bills.filter(x=>x.active&&!billOn(x))){
  const row={kind:'out',title:b.name,amount:b.amount,date:key(new Date(y,m,Math.min(b.due_day,last))),account:b.account,bill_id:b.id,done:false};
  const r=await dbAdd('jp_flows',row);if(r&&r[0])S.flows.push(r[0]);
 }
 toast('Added to this month');render();
}
async function syncPaychecks(){
 const amt=+S.settings.paycheck||0;if(!amt)return;
 const y=TODAY.getFullYear();
 for(const k of [...PAY].filter(k=>{const d=parse(k);return d>=new Date(y,TODAY.getMonth()-1,1)&&d<=new Date(y+1,11,31)})){
  if(S.flows.some(f=>f.date===k&&f.source==='State paycheck'))continue;
  const r=await dbAdd('jp_flows',{kind:'in',title:'State paycheck',amount:amt,date:k,source:'State paycheck',done:parse(k)<=TODAY});
  if(r&&r[0])S.flows.push(r[0]);
 }
}

/* ================= SHEETS ================= */
let sheet=null;
const closeSheet=()=>{if(sheet){sheet.remove();sheet=null}};
function openSheet(html){
 closeSheet();sheet=document.createElement('div');sheet.className='scrim';
 sheet.innerHTML=`<div class="sheet">${html}</div>`;
 sheet.onclick=e=>{if(e.target===sheet)closeSheet()};
 document.body.appendChild(sheet);
 sheet.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
}
function openTodo(list){
 openSheet(`<h3>Add to ${list}</h3><div class="sd">&nbsp;</div>
  <div class="fld"><label>WHAT</label><input id="tT" placeholder="Type it out"></div>
  <div class="acts"><button class="cancel" data-close>CANCEL</button><button class="save" id="tS">ADD</button></div>`);
 tT.focus();
 tS.onclick=async()=>{if(!tT.value.trim())return;
  const r=await dbAdd('jp_todos',{title:tT.value.trim(),list,done:false});
  if(r&&r[0])S.todos.push(r[0]);closeSheet();render()};
}
function openBill(b){
 const isNew=!b;
 openSheet(`<h3>${isNew?'Set up a bill':b.name}</h3>
  <div class="sd">${isNew?'Define it once. Each month it tells you if it is on the calendar.':(billOn(b)?'On this month':'Not on this month yet')}</div>
  <div class="fld"><label>BILL NAME</label><input id="bN" value="${isNew?'':b.name}" placeholder="Rent, Light bill, Kids insurance…"></div>
  <div class="two"><div class="fld"><label>TYPICAL AMOUNT</label><input id="bA" type="number" inputmode="decimal" value="${isNew?'':b.amount}"></div>
   <div class="fld"><label>DUE DAY</label><input id="bD" type="number" min="1" max="31" value="${isNew?1:b.due_day}"></div></div>
  <div class="fld"><label>PAID FROM</label><select id="bAcc">${ACCOUNTS.map(a=>`<option ${!isNew&&a===b.account?'selected':''}>${a}</option>`).join('')}</select></div>
  <div class="acts ${isNew?'':'three'}">${isNew?'':'<button class="del" id="bDel">DELETE</button>'}
   <button class="cancel" data-close>CANCEL</button><button class="save" id="bS">SAVE</button></div>`);
 bS.onclick=async()=>{
  if(!bN.value.trim())return;
  const row={name:bN.value.trim(),amount:+bA.value||0,due_day:+bD.value||1,account:bAcc.value,active:true};
  if(isNew){const r=await dbAdd('jp_bills',row);if(r&&r[0])S.bills.push(r[0])}
  else{Object.assign(b,row);await dbSet('jp_bills',b.id,row)}
  closeSheet();render()};
 if(!isNew)bDel.onclick=async()=>{if(!confirm('Delete '+b.name+'?'))return;
  S.bills=S.bills.filter(x=>x.id!==b.id);await dbDel('jp_bills',b.id);closeSheet();render()};
}
function openFlow(f,kindDefault){
 const isNew=!f;let kind=isNew?(kindDefault||'out'):f.kind;
 openSheet(`<h3>${isNew?'Add money':f.title}</h3><div class="sd">${isNew?'':(f.kind==='in'?'Money in':'Money out')}</div>
  ${isNew?`<div class="io" id="ioSw"><button data-k="in" class="${kind==='in'?'on':''}">MONEY IN</button><button data-k="out" class="${kind==='out'?'on':''}">MONEY OUT</button></div>`:''}
  <div class="fld"><label>WHAT IS IT</label><input id="fT" value="${isNew?'':f.title}" placeholder="Kids shoes, Light bill, Serve fee…"></div>
  <div class="two"><div class="fld"><label>AMOUNT</label><input id="fA" type="number" inputmode="decimal" value="${isNew?'':f.amount}"></div>
   <div class="fld"><label>DATE</label><input id="fD" type="date" value="${isNew?key(S.sel):f.date}"></div></div>
  <div class="fld ${kind==='in'?'':'hide'}" id="srcW"><label>WHERE FROM</label><select id="fSrc">${SOURCES.map(s=>`<option ${!isNew&&s===f.source?'selected':''}>${s}</option>`).join('')}</select></div>
  <div class="fld ${kind==='out'?'':'hide'}" id="accW"><label>PAID FROM</label><select id="fAcc">${ACCOUNTS.map(a=>`<option ${!isNew&&a===f.account?'selected':''}>${a}</option>`).join('')}</select></div>
  ${isNew?`<div class="fld"><label>REPEATS</label><select id="fR"><option value="none">Just once</option><option value="monthly">Every month (12×)</option><option value="biweekly">Every 2 weeks (26×)</option></select></div>`:''}
  ${isNew?'':`<div class="fld"><label>STATUS</label><div class="chips" id="dnSw"><button id="dnB" class="${f.done?'on':''}">${f.kind==='in'?'Received':'Paid'}</button></div></div>`}
  <div class="warnbox" id="wB"></div>
  <div class="acts ${isNew?'':'three'}">${isNew?'':'<button class="del" id="fDel">DELETE</button>'}
   <button class="cancel" data-close>CANCEL</button><button class="save" id="fS">${isNew?'ADD':'SAVE'}</button></div>`);
 let done=isNew?false:!!f.done;
 if(isNew)ioSw.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  ioSw.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');kind=b.dataset.k;
  srcW.classList.toggle('hide',kind!=='in');accW.classList.toggle('hide',kind!=='out');chk()});
 if(!isNew)dnB.onclick=()=>{done=!done;dnB.classList.toggle('on',done)};
 function chk(){
  const W=[];
  if(!fA.value)W.push(['soft','No amount means it will not count toward your totals.']);
  if(kind==='out'&&fD.value){const p=nextPay(TODAY);
   if(p&&parse(fD.value)<=p&&parse(fD.value)>=TODAY){const{amt}=beforeNextPay();
    W.push(['soft','Lands before '+p.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' — '+money(amt+(+fA.value||0))+' due before then.'])}}
  wB.innerHTML=W.map(([s,t])=>`<div class="warn ${s}">${t}</div>`).join('');
 }
 fA.oninput=chk;fD.onchange=chk;
 fS.onclick=async()=>{
  if(!fT.value.trim()||!fD.value)return;
  const base={kind,title:fT.value.trim(),amount:+fA.value||0,date:fD.value,
   source:kind==='in'?fSrc.value:null,account:kind==='out'?fAcc.value:null,done};
  if(isNew){
   const rep=fR.value,n=rep==='monthly'?12:rep==='biweekly'?26:1,sd=n>1?sid():null;
   for(let i=0;i<n;i++){const d=parse(fD.value);
    if(rep==='monthly')d.setMonth(d.getMonth()+i);
    if(rep==='biweekly')d.setDate(d.getDate()+14*i);
    const r=await dbAdd('jp_flows',{...base,date:key(d),series_id:sd});if(r&&r[0])S.flows.push(r[0])}
  }else{Object.assign(f,base);await dbSet('jp_flows',f.id,base)}
  S.sel=parse(fD.value);S.cursor=new Date(S.sel);closeSheet();render()};
 if(!isNew)fDel.onclick=async()=>{if(!confirm('Delete '+f.title+'?'))return;
  S.flows=S.flows.filter(x=>x.id!==f.id);await dbDel('jp_flows',f.id);closeSheet();render()};
}
function openEvent(e){
 const isNew=!e;let cat=isNew?'Appointments':e.cat,who=isNew?'':(e.who||''),scope='one',allDay=isNew?false:!!e.all_day;
 openSheet(`<h3>${isNew?'Add to the calendar':e.title}</h3>
  <div class="sd">${isNew?'Pick a template or fill it in':(e.series_id?'Part of a repeating series':e.cat)}</div>
  ${isNew?`<div class="tmpl" id="tmpl">${TEMPLATES.map((t,i)=>`<button data-t="${i}">${t.l}</button>`).join('')}</div>`:''}
  <div class="fld"><label>WHAT</label><input id="eT" value="${isNew?'':e.title}" placeholder="Football practice, dentist, serve attempt…"></div>
  <div class="fld"><label>CATEGORY</label><div class="catgrid" id="cg">${CATLIST.map(c=>
   `<button data-c="${c}" class="${c===cat?'on':''}" style="--cs:var(--${CATS[c]}-s);--cb:var(--${CATS[c]}-b)"><i></i>${c}</button>`).join('')}</div></div>
  <div class="two"><div class="fld"><label>DATE</label><input id="eD" type="date" value="${isNew?key(S.sel):e.date}"></div>
   <div class="fld"><label>ENDS (MULTI-DAY)</label><input id="eED" type="date" value="${isNew?'':(e.end_date||'')}"></div></div>
  <div class="fld"><label>ALL DAY</label><div class="chips"><button id="adB" class="${allDay?'on':''}">All-day event</button></div></div>
  <div class="two" id="timeW" style="${allDay?'display:none':''}">
   <div class="fld"><label>TIME</label><input id="eTm" type="time" value="${isNew?'':(e.time||'')}"></div>
   <div class="fld"><label>LEAVE BY</label><input id="eL" type="time" value="${isNew?'':(e.leave_by||'')}"></div></div>
  <div class="fld"><label>WHO IT'S FOR</label><div class="chips" id="wc">${WHO.map(k=>
   `<button data-k="${k}" class="${k===who?'on':''}">${k}</button>`).join('')}</div></div>
  <div class="fld"><label>WHERE</label><input id="eLoc" value="${isNew?'':(e.location||'')}" placeholder="Field, school, office…"></div>
  ${isNew?`<div class="two"><div class="fld"><label>REPEATS</label><select id="eR"><option value="none">Just once</option><option value="weekly">Every week</option></select></div>
   <div class="fld"><label>UNTIL</label><input id="eRE" type="date"></div></div>`:''}
  ${(!isNew&&e.series_id)?`<div class="scope" id="scopeSw"><button data-s="one" class="on">Just this one<small>${parse(e.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small></button>
   <button data-s="all">This and all after<small>${S.events.filter(x=>x.series_id===e.series_id&&x.date>=e.date).length} dates</small></button></div>`:''}
  <div class="warnbox" id="wB"></div>
  <div class="acts ${isNew?'':'three'}">${isNew?'':'<button class="del" id="eDel">DELETE</button>'}
   <button class="cancel" data-close>CANCEL</button><button class="save" id="eS">${isNew?'ADD':'SAVE'}</button></div>
  ${(!isNew&&e.leave_by)?'<button class="addrow" id="remB">COPY REMINDER TEXT</button>':''}`);
 if(isNew)tmpl.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const t=TEMPLATES[b.dataset.t];
  eT.value=t.l;cat=t.cat;
  cg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.c===cat));
  allDay=!!t.allDay;adB.classList.toggle('on',allDay);timeW.style.display=allDay?'none':'';
  eTm.value=t.time||'';eL.value=t.leave||'';
  if(t.who){who=t.who;wc.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===who))}
  if(t.rep){eR.value=t.rep;eRE.value=t.end||''}
  chk()});
 cg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  cg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.c;chk()});
 wc.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const on=b.classList.contains('on');wc.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  if(!on){b.classList.add('on');who=b.dataset.k}else who=''});
 adB.onclick=()=>{allDay=!allDay;adB.classList.toggle('on',allDay);timeW.style.display=allDay?'none':''};
 const ss=document.getElementById('scopeSw');
 if(ss)ss.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  ss.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');scope=b.dataset.s});
 function chk(){
  const W=[],ds=eD.value,t=eTm.value;
  if(ds&&t&&!allDay){
   const d=parse(ds),hr=+t.split(':')[0]+(+t.split(':')[1])/60;
   if(FB_DAYS.includes(d.getDay())&&hr>=FB_S-0.5&&hr<=FB_E+0.5)W.push(['','Football practice is 6–8 PM that night. Leave by 5:30.']);
   if(GYM_DAYS.includes(d.getDay())&&hr<6)W.push(['soft','That is gym time — you are usually there before 6 AM.']);
   const sd=S.events.filter(x=>x.date===ds&&(!e||x.id!==e.id));
   if(sd.some(x=>x.time===t))W.push(['','Something else is already at that exact time.']);
   if(sd.length>=HEAVY)W.push(['soft','That would be thing number '+(sd.length+1)+' that day.']);
  }
  wB.innerHTML=W.map(([s,x])=>`<div class="warn ${s}">${x}</div>`).join('');
 }
 eD.onchange=chk;eTm.onchange=chk;
 const rb=document.getElementById('remB');
 if(rb)rb.onclick=()=>{navigator.clipboard.writeText(`${e.title} — leave by ${fmt(e.leave_by)} on ${parse(e.date).toLocaleDateString()}`);toast('Copied — paste into Reminders')};
 eS.onclick=async()=>{
  if(!eT.value.trim()||!eD.value)return;
  const base={title:eT.value.trim(),cat,date:eD.value,end_date:eED.value||null,
   time:allDay?null:(eTm.value||null),all_day:allDay,who:who||null,
   location:eLoc.value||null,leave_by:allDay?null:(eL.value||null)};
  if(isNew){
   const rep=eR.value,until=eRE.value?parse(eRE.value):null,sd=rep==='weekly'?sid():null;
   let d=parse(eD.value),count=0;
   do{
    const r=await dbAdd('jp_events',{...base,date:key(d),series_id:sd,series_end:eRE.value||null});
    if(r&&r[0])S.events.push(r[0]);
    d=new Date(d);d.setDate(d.getDate()+7);count++;
   }while(rep==='weekly'&&until&&d<=until&&count<60);
  }else if(scope==='all'&&e.series_id){
   const fam=S.events.filter(x=>x.series_id===e.series_id&&x.date>=e.date);
   for(const x of fam){const patch={...base,date:x.date};Object.assign(x,patch);await dbSet('jp_events',x.id,patch)}
  }else{Object.assign(e,base);await dbSet('jp_events',e.id,base)}
  S.sel=parse(eD.value);S.cursor=new Date(S.sel);closeSheet();render()};
 if(!isNew)eDel.onclick=async()=>{
  if(scope==='all'&&e.series_id){
   if(!confirm('Delete this and all after?'))return;
   S.events=S.events.filter(x=>!(x.series_id===e.series_id&&x.date>=e.date));
   await dbDelSeries('jp_events',e.series_id,e.date);
  }else{if(!confirm('Delete '+e.title+'?'))return;
   S.events=S.events.filter(x=>x.id!==e.id);await dbDel('jp_events',e.id)}
  closeSheet();render()};
}

/* ================= MENU ================= */
document.getElementById('moreBtn').onclick=()=>{
 openSheet(`<h3>More</h3><div class="sd">Backup and setup</div>
  <button class="addrow" id="expB" style="margin-top:0">EXPORT EVERYTHING</button>
  <button class="addrow" id="setupB">FIRST-TIME SETUP</button>
  <div class="acts"><button class="cancel" data-close style="grid-column:1/-1">CLOSE</button></div>`);
 expB.onclick=()=>{
  const blob=new Blob([JSON.stringify({events:S.events,todos:S.todos,flows:S.flows,bills:S.bills,accounts:S.accounts,settings:S.settings,notes:S.notes},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='jempire-planner-'+key(new Date())+'.json';a.click();toast('Exported')};

function openSetup(){
 openSheet(`<h3>First-time setup</h3><div class="sd">Four numbers and you're running.</div>
  <div class="fld"><label>PAYCHECK AMOUNT (EVERY OTHER FRIDAY)</label><input id="s1" type="number" inputmode="decimal" value="${S.settings.paycheck||''}"></div>
  <div class="fld"><label>CUSHION — END EACH MONTH WITH AT LEAST</label><input id="s2" type="number" inputmode="decimal" value="${S.settings.cushion||''}"></div>
  <div class="fld"><label>TYPICAL SPENDING PER WEEK</label><input id="s3" type="number" inputmode="decimal" value="${S.settings.weekly_spend||''}"></div>
  <div class="fld"><label>NAVY FEDERAL BALANCE RIGHT NOW</label><input id="s4" type="number" inputmode="decimal" value="${(S.accounts.find(a=>a.name==='Navy Federal')||{}).balance||''}"></div>
  <div class="acts"><button class="cancel" data-close>LATER</button><button class="save" id="sS">SAVE</button></div>`);
 sS.onclick=async()=>{
  S.settings.paycheck=+s1.value||0;S.settings.cushion=+s2.value||0;S.settings.weekly_spend=+s3.value||0;
  await dbSet('jp_settings',1,{paycheck:S.settings.paycheck,cushion:S.settings.cushion,weekly_spend:S.settings.weekly_spend});
  const nf=S.accounts.find(a=>a.name==='Navy Federal');
  if(nf){nf.balance=+s4.value||0;await dbSet('jp_accounts',nf.id,{balance:nf.balance})}
  await syncPaychecks();closeSheet();render();toast('Ready')};
}

/* ================= BOOT ================= */
document.getElementById('fab').onclick=()=>S.mode==='money'?openFlow(null,'out'):openEvent(null);
document.getElementById('todayBtn').onclick=()=>{S.cursor=new Date();S.sel=new Date();render()};
document.getElementById('themeBtn').onclick=async()=>{
 const dim=document.documentElement.dataset.theme==='dim';
 const t=dim?'light':'dim';document.documentElement.dataset.theme=t;
 document.getElementById('themeBtn').textContent=dim?'☀ Light':'◐ Dim';
 S.settings.theme=t;garden();dbSet('jp_settings',1,{theme:t})};
document.querySelectorAll('#modeSw button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.showAll=false;render()});
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
function step(n){
 if(S.mode==='money'||S.view==='month')S.cursor.setMonth(S.cursor.getMonth()+n);
 else if(S.view==='week')S.cursor.setDate(S.cursor.getDate()+7*n);
 else{S.sel.setDate(S.sel.getDate()+n);S.cursor=new Date(S.sel)}
 render();
}
(async function boot(){
 garden();
 document.getElementById('quote').textContent=QUOTES[new Date().getDate()%QUOTES.length];
 const [ev,td,fl,bl,ac,st,nt]=await Promise.all([
  dbAll('jp_events'),dbAll('jp_todos'),dbAll('jp_flows'),dbAll('jp_bills'),
  dbAll('jp_accounts?order=sort'),dbAll('jp_settings'),dbAll('jp_notes')]);
 S.events=ev||[];S.todos=td||[];S.flows=fl||[];S.bills=bl||[];S.accounts=ac||[];
 S.settings=(st&&st[0])||{};(nt||[]).forEach(n=>S.notes[n.date]=n.body);
 if(S.settings.theme==='dim'){document.documentElement.dataset.theme='dim';document.getElementById('themeBtn').textContent='◐ Dim'}
 PAY=payset();
 if(S.settings.paycheck)await syncPaychecks();
 if(window.innerWidth<820)S.view='day';
 render();
 if(!S.settings.paycheck&&!S.bills.length)setTimeout(openSetup,600);
})();
</script>
